name: Run Kaggle V6 soft-anchor N128 pilot

on:
  workflow_dispatch:
  push:
    branches: [audit/ao-baseline-full-n128]
    paths: [experiments/structure_aware/TRIGGER_V6_SOFT_ANCHOR_N128]

permissions:
  contents: read

jobs:
  submit-v6-n128:
    name: Submit V6 N128 seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - seed: 0
            username: ronganminh
            account: ddpg
          - seed: 1
            username: duythanhb1909984
            account: ppo

    env:
      KAGGLE_USERNAME: ${{ matrix.username }}
      KAGGLE_KEY: ${{ matrix.account == 'ddpg' && secrets.KAGGLE_DDPG_KEY || secrets.KAGGLE_PPO_KEY }}
      SEED: ${{ matrix.seed }}
      REPO_COMMIT: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "kaggle>=1.8.4,<3"

      - name: Build immutable V6 N128 kernel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kaggle_submit
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          seed = int(os.environ["SEED"])
          commit = os.environ["REPO_COMMIT"]
          slug = f"star-ris-td3-v6-soft-anchor-n128-seed-{seed}"
          tag = "v6_soft_anchor_n128_100k"
          runner = f'''from __future__ import annotations
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          repo = Path("/kaggle/working/STAR_RIS_RSMA_TD3")
          if repo.exists():
              shutil.rmtree(repo)
          subprocess.run(["git", "clone", "--filter=blob:none", "https://github.com/Juliolayme/STAR_RIS_RSMA_TD3.git", str(repo)], check=True)
          subprocess.run(["git", "checkout", "--detach", "{commit}"], cwd=repo, check=True)
          subprocess.run([sys.executable, "-m", "pip", "install", "-q", "--no-build-isolation", "-e", str(repo)], check=True)
          subprocess.run([
              sys.executable, "scripts/create_scenario_banks.py",
              "--config", "configs/v3/pilot_v6_soft_anchor_n128.yaml",
              "--output-dir", "artifacts/scenario_banks",
              "--train-count", "10000", "--validation-count", "1000", "--test-count", "1000",
          ], cwd=repo, check=True)
          subprocess.run([
              sys.executable, "scripts/pilot_structure_aware_td3.py",
              "--config", "configs/v3/pilot_v6_soft_anchor_n128.yaml",
              "--seed", "{seed}", "--tag", "{tag}",
              "--output-root", "/kaggle/working/structure_pilot",
          ], cwd=repo, check=True)
          shutil.make_archive(
              f"/kaggle/working/{tag}_seed{seed}", "zip",
              "/kaggle/working/structure_pilot", f"{tag}_seed{seed}",
          )
          '''
          Path("kaggle_submit/runner.py").write_text(runner, encoding="utf-8")
          metadata = {
              "id": f"{os.environ['KAGGLE_USERNAME']}/{slug}",
              "title": slug,
              "code_file": "runner.py",
              "language": "python",
              "kernel_type": "script",
              "is_private": True,
              "enable_gpu": True,
              "enable_internet": True,
              "enable_tpu": False,
              "dataset_sources": [], "kernel_sources": [], "competition_sources": [],
          }
          Path("kaggle_submit/kernel-metadata.json").write_text(json.dumps(metadata, indent=2))
          PY

      - name: Submit and monitor Kaggle kernel
        shell: bash
        run: |
          set -euo pipefail
          ref="${KAGGLE_USERNAME}/star-ris-td3-v6-soft-anchor-n128-seed-${SEED}"
          kaggle kernels push -p kaggle_submit --accelerator NvidiaTeslaT4 --timeout 43200
          for attempt in $(seq 1 180); do
            status="$(kaggle kernels status "$ref" 2>&1 || true)"
            echo "attempt=${attempt} ${status}"
            normalized="$(echo "$status" | tr '[:upper:]' '[:lower:]')"
            if echo "$normalized" | grep -Eq 'complete|success'; then exit 0; fi
            if echo "$normalized" | grep -Eq 'error|failed|cancel'; then exit 1; fi
            sleep 60
          done
          exit 1

name: Apply thesis reviewer revisions

on:
  push:
    branches:
      - thesis/revision-review-v1
    paths:
      - "thesis/TRIGGER_REVIEW_REVISIONS"

permissions:
  contents: write

jobs:
  revise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout revision branch
        uses: actions/checkout@v4
        with:
          ref: thesis/revision-review-v1
          fetch-depth: 0

      - name: Reconstruct revision assets
        run: |
          set -euo pipefail
          cat thesis/revision_payload/t[0-9][0-9] > thesis/scripts/revise_thesis_transform.py
          cat thesis/revision_payload/conc[0-9][0-9] > thesis/conclusion.tex
          cat thesis/revision_payload/appa[0-9][0-9] > thesis/appendixA.tex
          cat thesis/revision_payload/appb[0-9][0-9] > thesis/appendixB.tex
          cat thesis/revision_payload/appc[0-9][0-9] > thesis/appendixC.tex
          python -m py_compile thesis/scripts/revise_thesis_transform.py

      - name: Apply academic revisions
        run: |
          set -euo pipefail
          python thesis/scripts/revise_thesis_transform.py
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('thesis/frontmatter.tex'),
              Path('thesis/introduction.tex'),
              Path('thesis/chapter1.tex'),
              Path('thesis/chapter2.tex'),
              Path('thesis/chapter3.tex'),
              Path('thesis/chapter4.tex'),
              Path('thesis/conclusion.tex'),
              Path('thesis/appendixA.tex'),
              Path('thesis/appendixB.tex'),
              Path('thesis/appendixC.tex'),
          ]
          replacements = {
              'đã được kiểm tra đối chiếu với repository của đề tài': 'đã được kiểm tra đối chiếu với dữ liệu và quy trình thực nghiệm của đề tài',
              'mã nguồn, quy trình mô phỏng': 'quy trình mô phỏng',
              'không phụ thuộc tên thư mục, nhánh phát triển hoặc phiên bản mã nguồn cụ thể': 'không phụ thuộc cấu trúc lưu trữ hoặc phiên bản triển khai cụ thể',
              'repository': 'kho dữ liệu nghiên cứu',
              'source code': 'phần mềm triển khai',
              'mã nguồn': 'phần mềm triển khai',
          }
          for path in paths:
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Download official UTH logo
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/Juliolayme/STAR_RIS_RSMA_MADDPG_PAPER_FREEZE_v1/main/latex_thesis/figures/logo_uth.png \
            -o thesis/figures/logo_uth.png
          test -s thesis/figures/logo_uth.png
          file thesis/figures/logo_uth.png | grep -q 'PNG image data'

      - name: Validate reviewer requirements
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          active = [
              Path('thesis/introduction.tex'), Path('thesis/chapter1.tex'),
              Path('thesis/chapter2.tex'), Path('thesis/chapter3.tex'),
              Path('thesis/chapter4.tex'), Path('thesis/conclusion.tex'),
              Path('thesis/appendixA.tex'), Path('thesis/appendixB.tex'),
              Path('thesis/appendixC.tex'), Path('thesis/frontmatter.tex'),
          ]
          combined = '\n'.join(p.read_text(encoding='utf-8') for p in active)
          forbidden = [
              r'Câu hỏi nghiên cứu', r'RQ[1-4]', r'scientific commit',
              r'git commit', r'nhánh phát triển', r'repository',
              r'results/', r'six_method_v1', r'VALIDATION_RAW',
              r'physical_v3', r'blockwise_v2', r'source code', r'mã nguồn',
          ]
          for pattern in forbidden:
              if re.search(pattern, combined, flags=re.I):
                  raise SystemExit(f'Forbidden visible term remains: {pattern}')

          display = re.compile(
              r'\\begin\{subequations\}.*?\\end\{subequations\}'
              r'|\\begin\{align\}.*?\\end\{align\}'
              r'|\\begin\{equation\}.*?\\end\{equation\}', re.S)
          for path in [Path('thesis/chapter1.tex'), Path('thesis/chapter2.tex'), Path('thesis/chapter3.tex')]:
              text = path.read_text(encoding='utf-8')
              for index, match in enumerate(display.finditer(text), start=1):
                  following = text[match.end():match.end()+1400]
                  if 'Trong đó' not in following:
                      raise SystemExit(f'{path}: formula {index} lacks symbol explanation')
                  if 'Công thức' not in following and 'Hệ công thức' not in following:
                      raise SystemExit(f'{path}: formula {index} lacks purpose/role explanation')
          print('All reviewer requirements validated')
          PY

      - name: Commit revised thesis sources
        run: |
          set -euo pipefail
          rm -rf thesis/revision_payload
          rm -f thesis/TRIGGER_REVIEW_REVISIONS
          rm -f thesis/chapter2_frag_00.tex thesis/chapter2_part1.tex
          rm -f .github/workflows/apply-thesis-review-revisions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Revise thesis narrative, formulas, AO methods, and UTH cover"
          git push origin HEAD:thesis/revision-review-v1

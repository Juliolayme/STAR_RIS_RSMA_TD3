name: Collect canonical six-method benchmark v2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - experiments/six_method/COLLECT_V2_NOW

permissions:
  contents: write

concurrency:
  group: collect-six-method-benchmark-v1
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      EXPECTED_SCIENTIFIC_COMMIT: 99318fefa53bef91fa5f105ec71ddae73fc96c39

    steps:
      - name: Checkout collector code from main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Stop when audited result is already published
        id: published
        run: |
          set -euo pipefail
          git fetch origin experiments/drl-six-method-v1
          if git cat-file -e origin/experiments/drl-six-method-v1:results/six_method_v1/SIX_METHOD_AUDIT.json 2>/dev/null; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "Six-method audited result is already published."
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.published.outputs.done != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        if: steps.published.outputs.done != 'true'
        run: python -m pip install "kaggle>=1.8.4,<3"

      - name: Download six completed DRL outputs and three baselines
        if: steps.published.outputs.done != 'true'
        id: download
        env:
          TD3_USER: thanhnguyen1423
          TD3_KEY: ${{ secrets.KAGGLE_TD3_KEY }}
          DDPG_USER: ronganminh
          DDPG_KEY: ${{ secrets.KAGGLE_DDPG_KEY }}
          PPO_USER: duythanhb1909984
          PPO_KEY: ${{ secrets.KAGGLE_PPO_KEY }}
        run: |
          set -euo pipefail
          rm -rf collected
          mkdir -p collected/drl collected/baselines

          download_kernel() {
            local user="$1"
            local key="$2"
            local ref="$3"
            local destination="$4"
            local status
            status=$(KAGGLE_USERNAME="$user" KAGGLE_KEY="$key" kaggle kernels status "$ref" 2>&1)
            echo "$ref: $status"
            echo "$status" | grep -Eqi "COMPLETE" || {
              echo "Kernel is not complete: $ref" >&2
              exit 1
            }
            mkdir -p "$destination"
            KAGGLE_USERNAME="$user" KAGGLE_KEY="$key" \
              kaggle kernels output "$ref" -p "$destination"
          }

          download_kernel "$TD3_USER" "$TD3_KEY" \
            thanhnguyen1423/star-ris-td3-six-method-benchmark-16-32-64 \
            collected/drl/td3_low_n
          download_kernel "$TD3_USER" "$TD3_KEY" \
            thanhnguyen1423/star-ris-td3-six-method-benchmark-96-128 \
            collected/drl/td3_high_n
          download_kernel "$DDPG_USER" "$DDPG_KEY" \
            ronganminh/star-ris-ddpg-six-method-benchmark-16-32-64 \
            collected/drl/ddpg_low_n
          download_kernel "$DDPG_USER" "$DDPG_KEY" \
            ronganminh/star-ris-ddpg-six-method-benchmark-96-128 \
            collected/drl/ddpg_high_n
          download_kernel "$PPO_USER" "$PPO_KEY" \
            duythanhb1909984/star-ris-ppo-six-method-benchmark-16-32-64 \
            collected/drl/ppo_low_n
          download_kernel "$PPO_USER" "$PPO_KEY" \
            duythanhb1909984/star-ris-ppo-six-method-benchmark-96-128 \
            collected/drl/ppo_high_n

          KAGGLE_USERNAME="$DDPG_USER" KAGGLE_KEY="$DDPG_KEY" \
            kaggle kernels output ronganminh/star-ris-ao-grid-final \
            -p collected/baselines/ao_grid
          KAGGLE_USERNAME="$DDPG_USER" KAGGLE_KEY="$DDPG_KEY" \
            kaggle kernels output ronganminh/star-ris-ao-sca-final \
            -p collected/baselines/ao_sca
          KAGGLE_USERNAME="$PPO_USER" KAGGLE_KEY="$PPO_KEY" \
            kaggle kernels output duythanhb1909984/star-ris-analytical-ris-final \
            -p collected/baselines/analytical_ris

      - name: Select one canonical manifest per DRL stage
        if: steps.published.outputs.done != 'true'
        id: provenance
        run: |
          set -euo pipefail
          python scripts/select_six_method_stage_outputs.py \
            --drl-root collected/drl \
            --selected-root collected/drl_selected \
            --index collected/SELECTED_STAGE_MANIFESTS.json
          stage_commit=$(python - <<'PY'
          import json
          print(json.load(open("collected/SELECTED_STAGE_MANIFESTS.json"))["repository_commit"])
          PY
          )
          if [[ "$stage_commit" != "$EXPECTED_SCIENTIFIC_COMMIT" ]]; then
            echo "Unexpected canonical scientific commit: $stage_commit" >&2
            exit 1
          fi
          echo "stage_commit=$stage_commit" >> "$GITHUB_OUTPUT"

      - name: Checkout exact scientific commit and install
        if: steps.published.outputs.done != 'true'
        run: |
          set -euo pipefail
          git checkout --detach "${{ steps.provenance.outputs.stage_commit }}"
          python -m pip install --no-build-isolation -e ".[dev]" tabulate

      - name: Recreate locked banks and verify canonical checksums
        if: steps.published.outputs.done != 'true'
        run: |
          set -euo pipefail
          mkdir -p artifacts/scenario_banks
          for n in 16 32 64 96 128; do
            python scripts/create_scenario_banks.py \
              --config "configs/v3/constrained_action_n${n}.yaml" \
              --output-dir artifacts/scenario_banks \
              --train-count 10000 \
              --validation-count 1000 \
              --test-count 1000
          done
          python - <<'PY'
          import json
          from star_ris_rsma.config import ExperimentConfig
          from star_ris_rsma.scenario_bank import ScenarioBank

          index = json.load(open("collected/SELECTED_STAGE_MANIFESTS.json"))
          selected = index["selected_stages"]
          for n in (16, 32, 64, 96, 128):
              cfg = ExperimentConfig.from_yaml(f"configs/v3/constrained_action_n{n}.yaml")
              observed = ScenarioBank.load(
                  f"artifacts/scenario_banks/N{n}_test.npz", cfg
              ).checksum()
              declared = {
                  stage["scenario_bank_checksums"][str(n)]["test"]
                  for stage in selected.values()
                  if str(n) in stage["scenario_bank_checksums"]
              }
              if declared != {observed}:
                  raise SystemExit(
                      f"N={n} checksum mismatch: declared={declared}, observed={observed}"
                  )
              print(f"N={n} canonical test bank checksum verified: {observed}")
          PY

      - name: Benchmark all six methods on one CPU runner
        if: steps.published.outputs.done != 'true'
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          rm -rf collected/latency
          mkdir -p collected/latency
          for n in 16 32 64 96 128; do
            config="configs/v3/constrained_action_n${n}.yaml"
            bank="artifacts/scenario_banks/N${n}_test.npz"
            for method in td3 ddpg ppo; do
              if (( n <= 64 )); then group=low_n; else group=high_n; fi
              stage_id="${method}_${group}"
              stage_root=$(python - "$stage_id" <<'PY'
          import json
          import sys
          index = json.load(open("collected/SELECTED_STAGE_MANIFESTS.json"))
          print(index["selected_stages"][sys.argv[1]]["stage_root"])
          PY
              )
              mapfile -t checkpoints < <(
                find "$stage_root" -type f \
                  -path "*/final_${method}_v3/N${n}/seed_0/train/best.pt"
              )
              if [[ ${#checkpoints[@]} -ne 1 ]]; then
                echo "Expected one canonical seed-0 checkpoint for ${method} N=${n}, found ${#checkpoints[@]}" >&2
                printf '%s\n' "${checkpoints[@]}" >&2
                exit 1
              fi
              python scripts/benchmark_latency.py \
                --method "$method" --config "$config" --bank "$bank" \
                --checkpoint "${checkpoints[0]}" --seed 0 --warmup 10 --count 100 \
                --output "collected/latency/${method}_N${n}.csv"
            done
            for method in ao_sca ao_grid analytical_ris; do
              python scripts/benchmark_latency.py \
                --method "$method" --config "$config" --bank "$bank" \
                --seed 0 --warmup 10 --count 100 \
                --output "collected/latency/${method}_N${n}.csv"
            done
          done
          python - <<'PY'
          import re
          from pathlib import Path
          import pandas as pd

          for path in Path("collected/latency").glob("*.csv"):
              match = re.search(r"_N(\d+)\.csv$", path.name)
              if not match:
                  raise SystemExit(f"Cannot parse N from {path}")
              frame = pd.read_csv(path)
              frame.insert(1, "n_ris", int(match.group(1)))
              frame.to_csv(path, index=False)
          PY

      - name: Generate audited six-method tables and figures
        if: steps.published.outputs.done != 'true'
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/six_method_v1"
          rm -rf "$report"
          python scripts/build_six_method_report.py \
            --drl-root collected/drl_selected \
            --baseline-root collected/baselines \
            --latency-root collected/latency \
            --output "$report"

          mkdir -p "$report/convergence" "$report/raw/convergence"
          python - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          report = Path(os.environ["RUNNER_TEMP"]) / "six_method_v1"
          for manifest_path in Path("collected/drl_selected").glob("*/STAGE_MANIFEST.json"):
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              stage_id = manifest["stage_id"]
              for figure in (manifest_path.parent / "figures").glob("*"):
                  if figure.is_file():
                      shutil.copy2(figure, report / "convergence" / f"{stage_id}_{figure.name}")
              for pattern in ("*_TRAINING_RAW.csv", "*_VALIDATION_RAW.csv"):
                  for raw in manifest_path.parent.glob(pattern):
                      shutil.copy2(raw, report / "raw" / "convergence" / f"{stage_id}_{raw.name}")
          PY
          verdict=$(python - <<'PY'
          import json
          import os
          path = os.path.join(os.environ["RUNNER_TEMP"], "six_method_v1", "SIX_METHOD_AUDIT.json")
          print(json.load(open(path))["verdict"])
          PY
          )
          test "$verdict" = PASS

      - name: Upload canonical collected evidence
        if: steps.published.outputs.done != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: star-ris-six-method-canonical-evidence
          path: |
            collected/SELECTED_STAGE_MANIFESTS.json
            collected/drl_selected
            collected/baselines
            collected/latency
            ${{ runner.temp }}/six_method_v1
          if-no-files-found: error
          retention-days: 30

      - name: Commit audited report to experiment branch
        if: steps.published.outputs.done != 'true'
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/six_method_v1"
          git fetch origin experiments/drl-six-method-v1
          git checkout experiments/drl-six-method-v1
          rm -rf results/six_method_v1
          mkdir -p results
          cp -a "$report" results/six_method_v1
          cp collected/SELECTED_STAGE_MANIFESTS.json \
            results/six_method_v1/SELECTED_STAGE_MANIFESTS.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/six_method_v1
          git commit -m "Publish audited canonical TD3 DDPG PPO six-method results"
          git push origin HEAD:experiments/drl-six-method-v1

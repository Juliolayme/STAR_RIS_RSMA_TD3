name: Audit Kaggle final academic output

on:
  workflow_dispatch:
  push:
    branches:
      - agent/td3-qos-scalability-v2
    paths:
      - ".github/workflows/audit-kaggle-final-output.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/audit-kaggle-final-output.yml"

permissions:
  contents: read

jobs:
  audit-final-output:
    name: Download and scientifically audit notebook 06 output
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KAGGLE_PPO_KEY: ${{ secrets.KAGGLE_PPO_KEY }}
      FINAL_KERNEL_REF: duythanhb1909984/star-ris-final-academic-bundle

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install audit dependencies
        run: python -m pip install --upgrade "kaggle>=1.8.4,<3" pandas numpy tabulate

      - name: Download notebook 06 output
        shell: bash
        run: |
          set -euo pipefail
          export KAGGLE_USERNAME="duythanhb1909984"
          export KAGGLE_KEY="${KAGGLE_PPO_KEY}"
          rm -rf final_output audit_workspace
          mkdir -p final_output audit_workspace
          kaggle kernels status "$FINAL_KERNEL_REF"
          kaggle kernels output "$FINAL_KERNEL_REF" -p final_output -o
          echo "=== NOTEBOOK OUTPUT TREE ==="
          find final_output -type f -printf '%P\t%s bytes\n' | sort

      - name: Audit scientific deliverables
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import math
          import shutil
          import zipfile
          from pathlib import Path

          import numpy as np
          import pandas as pd

          output_root = Path("final_output").resolve()
          audit_root = Path("audit_workspace").resolve()
          extracted_root = audit_root / "extracted"
          selected_root = audit_root / "selected_results"
          extracted_root.mkdir(parents=True, exist_ok=True)
          selected_root.mkdir(parents=True, exist_ok=True)

          fatal: list[str] = []
          warnings: list[str] = []
          notes: list[str] = []
          evidence: dict[str, object] = {}

          all_output_files = sorted(path for path in output_root.rglob("*") if path.is_file())
          print(f"Downloaded files: {len(all_output_files)}")
          for path in all_output_files:
              print(f"OUTPUT\t{path.relative_to(output_root)}\t{path.stat().st_size} bytes")

          archives = [path for path in all_output_files if path.name == "FINAL_THESIS_PAPER_BUNDLE.zip"]
          if len(archives) > 1:
              fatal.append(f"Multiple FINAL_THESIS_PAPER_BUNDLE.zip files found: {archives}")
          for archive_path in archives:
              with zipfile.ZipFile(archive_path) as archive:
                  archive.extractall(extracted_root)
              shutil.copy2(archive_path, selected_root / archive_path.name)
              print(f"Extracted final bundle: {archive_path}")

          search_roots = [output_root, extracted_root]

          def matches(name: str) -> list[Path]:
              found: list[Path] = []
              for root in search_roots:
                  found.extend(path for path in root.rglob(name) if path.is_file())
              unique: dict[str, Path] = {}
              for path in found:
                  try:
                      key = str(path.resolve())
                  except OSError:
                      key = str(path)
                  unique[key] = path
              return sorted(unique.values())

          def one(name: str, *, required: bool = True) -> Path | None:
              found = matches(name)
              if not found:
                  if required:
                      fatal.append(f"Missing required deliverable: {name}")
                  return None
              if len(found) > 1:
                  # Kaggle often exposes both the unpacked directory and the final ZIP.
                  # Prefer the extracted bundle copy when content is duplicated.
                  extracted = [path for path in found if extracted_root in path.parents]
                  if len(extracted) == 1:
                      return extracted[0]
                  fatal.append(f"Expected one {name}, found {found}")
                  return None
              return found[0]

          required_files = [
              "RESULTS_README.md",
              "REPRODUCIBILITY_MANIFEST.json",
              "TABLE_FINAL_PERFORMANCE.csv",
              "TABLE_TD3_8SEED_CI95.csv",
              "TABLE_PAIRED_WILCOXON_HOLM.csv",
              "TABLE_CPU_LATENCY.csv",
              "TABLE_BASELINE_SOLVER_TIME_DESCRIPTIVE.csv",
              "TD3_TEST_RAW_ALL.csv",
              "BASELINES_RAW_ALL.csv",
              "LATENCY_RAW_ALL.csv",
          ]
          located: dict[str, Path] = {}
          for name in required_files:
              path = one(name)
              if path is not None:
                  located[name] = path
                  destination = selected_root / name
                  shutil.copy2(path, destination)
                  print(f"LOCATED\t{name}\t{path}")

          readme_path = located.get("RESULTS_README.md")
          manifest_path = located.get("REPRODUCIBILITY_MANIFEST.json")
          if readme_path:
              readme_text = readme_path.read_text(encoding="utf-8", errors="replace")
              evidence["results_readme"] = readme_text
          if manifest_path:
              try:
                  manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              except Exception as exc:
                  fatal.append(f"Cannot parse REPRODUCIBILITY_MANIFEST.json: {exc!r}")
                  manifest = {}
              evidence["reproducibility_manifest"] = manifest
              if manifest.get("n_values") != [16, 32, 64, 96, 128]:
                  fatal.append(f"Unexpected manifest n_values: {manifest.get('n_values')}")
              if manifest.get("td3_seeds") != list(range(8)):
                  fatal.append(f"Unexpected manifest td3_seeds: {manifest.get('td3_seeds')}")
              stage_manifests = manifest.get("stage_manifests", {})
              if not isinstance(stage_manifests, dict) or len(stage_manifests) != 5:
                  fatal.append(f"Expected five stage manifests, found: {stage_manifests}")
              if manifest.get("test_scenarios_per_n") != 1000:
                  fatal.append("Manifest does not declare 1,000 test scenarios per N")
              if manifest.get("latency_scenarios_per_n") != 1000:
                  fatal.append("Manifest does not declare 1,000 latency scenarios per N")

          expected_n = {16, 32, 64, 96, 128}
          expected_methods = {"td3", "ao_sca", "ao_grid", "analytical_ris"}
          quality_metrics = ["sum_rate", "qos_fraction", "all_qos", "violation"]

          def numeric_finite(frame: pd.DataFrame, columns: list[str], context: str) -> None:
              missing = [column for column in columns if column not in frame.columns]
              if missing:
                  fatal.append(f"{context}: missing columns {missing}")
                  return
              numeric = frame[columns].apply(pd.to_numeric, errors="coerce")
              if not np.isfinite(numeric.to_numpy(dtype=float)).all():
                  fatal.append(f"{context}: NaN/Inf detected in {columns}")

          performance_path = located.get("TABLE_FINAL_PERFORMANCE.csv")
          if performance_path:
              performance = pd.read_csv(performance_path)
              evidence["final_performance_columns"] = list(performance.columns)
              evidence["final_performance_rows"] = performance.to_dict(orient="records")
              required_columns = ["method", "n_ris", "seeds"]
              missing = [column for column in required_columns if column not in performance.columns]
              if missing:
                  fatal.append(f"TABLE_FINAL_PERFORMANCE missing {missing}")
              else:
                  performance["method"] = performance["method"].astype(str).str.lower()
                  performance["n_ris"] = pd.to_numeric(performance["n_ris"], errors="coerce")
                  pairs = set(zip(performance["method"], performance["n_ris"].astype("Int64")))
                  expected_pairs = {(method, n) for method in expected_methods for n in expected_n}
                  if pairs != expected_pairs:
                      fatal.append(
                          "Final performance method/N coverage mismatch: "
                          f"missing={sorted(expected_pairs - pairs)}, extra={sorted(pairs - expected_pairs)}"
                      )
                  if len(performance) != 20:
                      fatal.append(f"Expected 20 final performance rows, found {len(performance)}")
                  td3_seeds = set(pd.to_numeric(
                      performance.loc[performance["method"] == "td3", "seeds"], errors="coerce"
                  ).dropna().astype(int))
                  baseline_seeds = set(pd.to_numeric(
                      performance.loc[performance["method"] != "td3", "seeds"], errors="coerce"
                  ).dropna().astype(int))
                  if td3_seeds != {8}:
                      fatal.append(f"TD3 seed count is not eight: {sorted(td3_seeds)}")
                  if baseline_seeds != {1}:
                      fatal.append(f"Baseline seed labels are unexpected: {sorted(baseline_seeds)}")

              mean_columns = [f"{metric}_mean" for metric in quality_metrics]
              std_columns = [f"{metric}_std" for metric in quality_metrics]
              numeric_finite(performance, mean_columns + std_columns, "TABLE_FINAL_PERFORMANCE")
              for column in std_columns:
                  if column in performance and (pd.to_numeric(performance[column], errors="coerce") < 0).any():
                      fatal.append(f"Negative standard deviation in {column}")
              for metric in ("qos_fraction", "all_qos"):
                  column = f"{metric}_mean"
                  if column in performance:
                      values = pd.to_numeric(performance[column], errors="coerce")
                      if ((values < 0) | (values > 1)).any():
                          fatal.append(f"{column} outside [0,1]")
              if "violation_mean" in performance and (
                  pd.to_numeric(performance["violation_mean"], errors="coerce") < 0
              ).any():
                  fatal.append("Negative mean QoS violation")
              if "sum_rate_mean" in performance and (
                  pd.to_numeric(performance["sum_rate_mean"], errors="coerce") <= 0
              ).any():
                  fatal.append("Non-positive mean sum-rate")

              td3 = performance[performance.get("method", "").astype(str).str.lower() == "td3"].copy()
              if not td3.empty and "qos_fraction_mean" in td3:
                  td3_qos = dict(zip(
                      pd.to_numeric(td3["n_ris"], errors="coerce").astype(int),
                      pd.to_numeric(td3["qos_fraction_mean"], errors="coerce"),
                  ))
                  evidence["td3_qos_fraction_by_n"] = td3_qos
                  low_qos = {n: value for n, value in td3_qos.items() if value < 0.95}
                  if low_qos:
                      warnings.append(
                          "TD3 mean QoS fraction is below the predeclared 0.95 target at: "
                          + ", ".join(f"N={n}: {value:.4f}" for n, value in sorted(low_qos.items()))
                      )
              if not td3.empty and "all_qos_mean" in td3:
                  td3_all_qos = dict(zip(
                      pd.to_numeric(td3["n_ris"], errors="coerce").astype(int),
                      pd.to_numeric(td3["all_qos_mean"], errors="coerce"),
                  ))
                  evidence["td3_all_qos_by_n"] = td3_all_qos
                  weak = {n: value for n, value in td3_all_qos.items() if value < 0.5}
                  if weak:
                      warnings.append(
                          "TD3 all-users-QoS probability is below 0.5 at: "
                          + ", ".join(f"N={n}: {value:.4f}" for n, value in sorted(weak.items()))
                      )

          td3_ci_path = located.get("TABLE_TD3_8SEED_CI95.csv")
          if td3_ci_path:
              td3_ci = pd.read_csv(td3_ci_path)
              evidence["td3_ci_rows"] = td3_ci.to_dict(orient="records")
              if len(td3_ci) != 5 or set(pd.to_numeric(td3_ci.get("n_ris"), errors="coerce").dropna().astype(int)) != expected_n:
                  fatal.append("TD3 CI table does not contain exactly five N values")
              for metric in quality_metrics:
                  columns = [
                      f"{metric}_mean",
                      f"{metric}_std",
                      f"{metric}_ci95_low",
                      f"{metric}_ci95_high",
                  ]
                  numeric_finite(td3_ci, columns, f"TD3 CI {metric}")
                  if all(column in td3_ci for column in columns):
                      mean = pd.to_numeric(td3_ci[columns[0]], errors="coerce")
                      low = pd.to_numeric(td3_ci[columns[2]], errors="coerce")
                      high = pd.to_numeric(td3_ci[columns[3]], errors="coerce")
                      if ((low > mean) | (mean > high)).any():
                          fatal.append(f"TD3 {metric} mean lies outside CI95")

          stats_path = located.get("TABLE_PAIRED_WILCOXON_HOLM.csv")
          if stats_path:
              stats = pd.read_csv(stats_path)
              evidence["statistical_test_columns"] = list(stats.columns)
              evidence["statistical_test_rows"] = stats.to_dict(orient="records")
              if len(stats) != 15:
                  fatal.append(f"Expected 15 paired baseline-by-N tests, found {len(stats)}")
              p_columns = [column for column in stats.columns if "p" in column.lower() and "speedup" not in column.lower()]
              for column in p_columns:
                  values = pd.to_numeric(stats[column], errors="coerce")
                  finite = values.dropna()
                  if not ((finite >= 0) & (finite <= 1)).all():
                      fatal.append(f"Invalid p-value range in {column}")
              adjusted = [column for column in p_columns if "holm" in column.lower() or "adjust" in column.lower()]
              if adjusted:
                  significant = {
                      column: int((pd.to_numeric(stats[column], errors="coerce") < 0.05).sum())
                      for column in adjusted
                  }
                  evidence["significant_hypotheses_p_lt_0_05"] = significant

          latency_path = located.get("TABLE_CPU_LATENCY.csv")
          if latency_path:
              latency = pd.read_csv(latency_path)
              evidence["latency_rows"] = latency.to_dict(orient="records")
              if len(latency) != 5 or set(pd.to_numeric(latency.get("n_ris"), errors="coerce").dropna().astype(int)) != expected_n:
                  fatal.append("CPU latency table does not contain exactly five N values")
              mean_latency_columns = [column for column in latency.columns if column.endswith("_mean_ms")]
              if len(mean_latency_columns) < 4:
                  fatal.append(f"Expected four mean latency columns, found {mean_latency_columns}")
              else:
                  numeric_finite(latency, mean_latency_columns, "TABLE_CPU_LATENCY")
                  if (latency[mean_latency_columns].apply(pd.to_numeric, errors="coerce") <= 0).any().any():
                      fatal.append("CPU latency contains non-positive values")

          baseline_timing_path = located.get("TABLE_BASELINE_SOLVER_TIME_DESCRIPTIVE.csv")
          if baseline_timing_path:
              baseline_timing = pd.read_csv(baseline_timing_path)
              evidence["baseline_timing_rows"] = baseline_timing.to_dict(orient="records")
              if len(baseline_timing) != 15:
                  fatal.append(f"Expected 15 baseline timing rows, found {len(baseline_timing)}")
              positive_columns = [column for column in baseline_timing.columns if "solve_ms" in column and column != "solve_ms_std"]
              if positive_columns:
                  numeric_finite(baseline_timing, positive_columns, "Baseline timing")

          td3_raw_path = located.get("TD3_TEST_RAW_ALL.csv")
          if td3_raw_path:
              td3_raw = pd.read_csv(td3_raw_path)
              evidence["td3_test_raw_shape"] = list(td3_raw.shape)
              if len(td3_raw) != 40000:
                  fatal.append(f"Expected 40,000 TD3 test rows, found {len(td3_raw)}")
              numeric_finite(td3_raw, ["scenario", "n_ris", "seed", *quality_metrics], "TD3_TEST_RAW_ALL")
              if all(column in td3_raw for column in ["n_ris", "seed", "scenario"]):
                  pairs = set(zip(
                      pd.to_numeric(td3_raw["n_ris"], errors="coerce").astype(int),
                      pd.to_numeric(td3_raw["seed"], errors="coerce").astype(int),
                  ))
                  expected_pairs = {(n, seed) for n in expected_n for seed in range(8)}
                  if pairs != expected_pairs:
                      fatal.append("TD3 raw N/seed coverage mismatch")
                  for (n, seed), group in td3_raw.groupby(["n_ris", "seed"], sort=True):
                      scenarios = sorted(pd.to_numeric(group["scenario"], errors="coerce").astype(int).tolist())
                      if len(group) != 1000 or scenarios != list(range(1000)):
                          fatal.append(f"Incomplete TD3 raw coverage N={n}, seed={seed}")
                          break

          baseline_raw_path = located.get("BASELINES_RAW_ALL.csv")
          if baseline_raw_path:
              baseline_raw = pd.read_csv(baseline_raw_path)
              evidence["baseline_raw_shape"] = list(baseline_raw.shape)
              if len(baseline_raw) != 15000:
                  fatal.append(f"Expected 15,000 baseline rows, found {len(baseline_raw)}")
              numeric_finite(
                  baseline_raw,
                  ["scenario", "n_ris", "sum_rate", "qos_fraction", "all_qos", "violation", "solve_ms"],
                  "BASELINES_RAW_ALL",
              )

          latency_raw_path = located.get("LATENCY_RAW_ALL.csv")
          if latency_raw_path:
              latency_raw = pd.read_csv(latency_raw_path)
              evidence["latency_raw_shape"] = list(latency_raw.shape)
              if len(latency_raw) != 5000:
                  fatal.append(f"Expected 5,000 latency rows, found {len(latency_raw)}")

          figures: list[Path] = []
          for root in search_roots:
              figures.extend(path for path in root.rglob("*.png") if path.is_file())
          unique_figures = {path.name: path for path in figures}
          evidence["figure_files"] = sorted(unique_figures)
          if not unique_figures:
              fatal.append("No paper-ready PNG figures were found")
          elif len(unique_figures) < 8:
              warnings.append(f"Only {len(unique_figures)} unique PNG figures were found")
          for name, path in unique_figures.items():
              shutil.copy2(path, selected_root / name)

          verdict = "PASS" if not fatal else "FAIL"
          thesis_ready = not fatal
          if warnings:
              notes.append(
                  "Automated integrity checks passed with scientific caveats; claims must follow the warnings."
              )
          else:
              notes.append("Automated integrity and declared protocol checks passed without warnings.")

          report = {
              "verdict": verdict,
              "thesis_ready_for_document_integration": thesis_ready,
              "fatal_errors": fatal,
              "warnings": warnings,
              "notes": notes,
              "evidence": evidence,
          }
          (audit_root / "audit_report.json").write_text(
              json.dumps(report, indent=2, ensure_ascii=False, default=str),
              encoding="utf-8",
          )

          lines = [
              "# Final Kaggle Output Audit",
              "",
              f"- Verdict: **{verdict}**",
              f"- Thesis integration candidate: **{thesis_ready}**",
              f"- Fatal errors: **{len(fatal)}**",
              f"- Scientific warnings: **{len(warnings)}**",
              "",
              "## Fatal errors",
              "",
              *([f"- {item}" for item in fatal] or ["- None"]),
              "",
              "## Scientific warnings",
              "",
              *([f"- {item}" for item in warnings] or ["- None"]),
              "",
              "## Notes",
              "",
              *[f"- {item}" for item in notes],
              "",
              "## Discovered deliverables",
              "",
              *[f"- `{name}`" for name in sorted(located)],
              "",
              "## Figures",
              "",
              *[f"- `{name}`" for name in sorted(unique_figures)],
          ]
          (audit_root / "audit_report.md").write_text("\n".join(lines) + "\n", encoding="utf-8")

          print("=== AUDIT REPORT ===")
          print(json.dumps(report, indent=2, ensure_ascii=False, default=str))
          if fatal:
              raise SystemExit(1)
          PY

      - name: Upload audited final results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star-ris-final-output-audit
          path: |
            audit_workspace
            final_output
          if-no-files-found: error
          retention-days: 14

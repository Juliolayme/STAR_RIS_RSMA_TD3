name: Build four-chapter thesis PDF

on:
  push:
    branches:
      - thesis/restructure-4chap-v2
    paths:
      - "thesis/**"
      - "results/six_method_v1/**"
      - "references/references.bib"
      - ".github/workflows/build-thesis.yml"
  pull_request:
    branches:
      - thesis/restructure-4chap-v2
    paths:
      - "thesis/**"
      - "results/six_method_v1/**"
      - "references/references.bib"
      - ".github/workflows/build-thesis.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: thesis-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Verify four-chapter structure and figure files
        run: |
          set -euo pipefail
          ! grep -R "\\input{chapter5}" thesis/content*.tex
          ! grep -q "\\chapter\*{TÓM TẮT}" thesis/frontmatter.tex
          ! grep -q "\\chapter\*{ABSTRACT}" thesis/frontmatter.tex
          for f in \
            thesis/figures/pdf/chapter1_fig01_oma_sdma_noma_rsma.pdf \
            thesis/figures/pdf/chapter1_fig02_ris_vs_star_ris.pdf \
            thesis/figures/pdf/chapter1_fig03_drl_control_loop.pdf \
            thesis/figures/pdf/chapter2_fig01_system_model_3d.pdf \
            thesis/figures/pdf/chapter2_fig02_rsma_transmit_decode.pdf \
            thesis/figures/pdf/chapter2_fig03_optimization_variables_constraints.pdf \
            thesis/figures/pdf/chapter3_fig01_td3_architecture.pdf \
            thesis/figures/pdf/chapter3_fig02_action_decoder.pdf \
            thesis/figures/pdf/chapter3_fig03_train_validation_test_pipeline.pdf \
            thesis/figures/pdf/chapter4_fig01_training_overview.pdf \
            thesis/figures/pdf/chapter4_fig03_quality_qos_latency_tradeoff.pdf; do
            test -s "$f"
          done
          grep -q '"verdict".*"PASS"' results/six_method_v1/SIX_METHOD_AUDIT.json

      - name: Set up Python table generator
        run: python -m pip install --disable-pip-version-check pandas

      - name: Regenerate audited tables and normalize figure layouts
        run: |
          python thesis/scripts/generate_six_method_thesis_assets.py
          python thesis/scripts/normalize_figure_layouts.py

      - name: Install XeLaTeX and PDF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk biber ghostscript \
            texlive-xetex texlive-latex-extra texlive-fonts-recommended \
            texlive-lang-other texlive-science texlive-bibtex-extra \
            texlive-pictures fonts-texgyre poppler-utils

      - name: Normalize Draw.io PDFs for XeLaTeX
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/thesis_pdf_normalized"
          for pdf in thesis/figures/pdf/*.pdf; do
            out="$RUNNER_TEMP/thesis_pdf_normalized/$(basename "$pdf")"
            gs -q -dNOPAUSE -dBATCH -dSAFER \
              -sDEVICE=pdfwrite \
              -dCompatibilityLevel=1.7 \
              -dPDFSETTINGS=/prepress \
              -dDetectDuplicateImages=true \
              -dCompressFonts=true \
              -sOutputFile="$out" "$pdf"
            test -s "$out"
            mv "$out" "$pdf"
          done

      - name: Build thesis
        id: thesis_build
        continue-on-error: true
        working-directory: thesis
        shell: bash
        run: |
          set -o pipefail
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex 2>&1 | tee latexmk-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            mkdir -p build
            cp main.pdf build/Nguyen_Duy_Thanh_STAR_RIS_RSMA_TD3_Thesis_4CH.pdf
            pdfinfo build/Nguyen_Duy_Thanh_STAR_RIS_RSMA_TD3_Thesis_4CH.pdf
          fi
          exit "$status"

      - name: Upload LaTeX diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thesis-latex-diagnostics
          path: |
            thesis/latexmk-output.log
            thesis/main.log
            thesis/main.blg
            thesis/main.bcf
            thesis/main.fls
          if-no-files-found: warn
          retention-days: 7

      - name: Stop after failed LaTeX build
        if: steps.thesis_build.outcome == 'failure'
        run: exit 1

      - name: Reject unresolved references and missing figures
        working-directory: thesis
        run: |
          set -euo pipefail
          if grep -E "LaTeX Warning: (Citation|Reference).*undefined|There were undefined references|File .* not found" main.log; then
            echo "Unresolved citation/reference or missing figure detected"
            exit 1
          fi
          chapter_count=$(grep -c '^\\chapter{' chapter1.tex chapter2.tex chapter3.tex chapter4.tex | awk -F: '{s+=$2} END{print s}')
          test "$chapter_count" -eq 4

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nguyen_Duy_Thanh_STAR_RIS_RSMA_TD3_Thesis_4CH
          path: thesis/build/Nguyen_Duy_Thanh_STAR_RIS_RSMA_TD3_Thesis_4CH.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Commit normalized sources, generated tables, and built PDF
        if: github.event_name == 'push'
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thesis/chapter1.tex thesis/chapter2.tex thesis/chapter3.tex thesis/chapter4.tex
          git add thesis/generated
          git add -f thesis/build/Nguyen_Duy_Thanh_STAR_RIS_RSMA_TD3_Thesis_4CH.pdf
          if git diff --cached --quiet; then
            echo "Normalized sources, generated assets, and PDF unchanged"
            exit 0
          fi
          git commit -m "Build audited four-chapter thesis PDF [skip ci]"
          git push origin "HEAD:${SOURCE_BRANCH}"

name: Collect V6 comparator pilot

on:
  workflow_dispatch:
  push:
    branches: [audit/ao-baseline-full-n128]
    paths: [experiments/structure_aware/COLLECT_V6_COMPARATOR_PILOT]

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install "kaggle>=1.8.4,<3" pandas tabulate
      - name: Download eight comparator kernels
        env:
          TD3_KEY: ${{ secrets.KAGGLE_TD3_KEY }}
          DDPG_KEY: ${{ secrets.KAGGLE_DDPG_KEY }}
          PPO_KEY: ${{ secrets.KAGGLE_PPO_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          get() {
            local user="$1" key="$2" method="$3" n="$4" seed="$5"
            local ref="${user}/star-ris-${method}-v6-n${n}-seed-${seed}"
            local dest="collected/${method}_n${n}_seed${seed}"
            status="$(KAGGLE_USERNAME="$user" KAGGLE_KEY="$key" kaggle kernels status "$ref" 2>&1)"
            echo "$ref: $status"; echo "$status" | grep -Eqi 'COMPLETE|SUCCESS'
            mkdir -p "$dest"
            KAGGLE_USERNAME="$user" KAGGLE_KEY="$key" kaggle kernels output "$ref" -p "$dest" --force --file-pattern "${method}_v6_soft_anchor_n${n}_100k_seed${seed}\\.zip$" --page-size 200
          }
          get thanhnguyen1423 "$TD3_KEY" ddpg 32 0
          get ronganminh "$DDPG_KEY" ddpg 32 1
          get ronganminh "$DDPG_KEY" ddpg 128 0
          get ronganminh "$DDPG_KEY" ddpg 128 1
          get thanhnguyen1423 "$TD3_KEY" ppo 32 0
          get ronganminh "$DDPG_KEY" ppo 32 1
          get duythanhb1909984 "$PPO_KEY" ppo 128 0
          get thanhnguyen1423 "$TD3_KEY" ppo 128 1
          find collected -name '*.zip' -type f -print0 | while IFS= read -r -d '' archive; do unzip -oq "$archive" -d "${archive%.zip}_extracted"; done
      - name: Audit and aggregate
        run: |
          python scripts/audit_v6_comparator_pilot.py --input collected --output comparator_audit
          cat comparator_audit/COMPARATOR_REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: v6-ddpg-ppo-comparator-pilot
          path: |
            collected/
            comparator_audit/
          retention-days: 90

name: Diagnose latest six-method collector

on:
  push:
    branches:
      - main
    paths:
      - experiments/six_method/DIAGNOSE_COLLECTOR_NOW
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch latest collector run and logs
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/collector_diagnostic"
          rm -rf "$out"
          mkdir -p "$out"
          gh run list \
            --workflow collect-six-method-results.yml \
            --limit 10 \
            --json databaseId,name,status,conclusion,event,headSha,headBranch,url,createdAt,updatedAt \
            > "$out/COLLECTOR_RUNS.json"
          latest=$(python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'collector_diagnostic'
          runs = json.loads((root / 'COLLECTOR_RUNS.json').read_text())
          if not runs:
              raise SystemExit('No collector workflow run found')
          print(runs[0]['databaseId'])
          PY
          )
          echo "$latest" > "$out/LATEST_RUN_ID.txt"
          gh run view "$latest" \
            --json databaseId,name,status,conclusion,event,headSha,headBranch,url,jobs \
            > "$out/LATEST_RUN_SUMMARY.json" || true
          gh run view "$latest" --log > "$out/LATEST_RUN.log" 2>&1 || true
          cat "$out/COLLECTOR_RUNS.json"
          cat "$out/LATEST_RUN_SUMMARY.json"

      - name: Persist collector diagnostic on experiment branch
        run: |
          set -euo pipefail
          git fetch origin experiments/drl-six-method-v1
          git checkout experiments/drl-six-method-v1
          target="experiments/six_method/collector_diagnostic"
          rm -rf "$target"
          mkdir -p "$target"
          cp -a "$RUNNER_TEMP/collector_diagnostic/." "$target/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "Record latest six-method collector diagnostic" || true
          git push origin HEAD:experiments/drl-six-method-v1

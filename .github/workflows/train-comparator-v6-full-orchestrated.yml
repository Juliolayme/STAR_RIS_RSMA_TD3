name: Train DDPG/PPO V6 full orchestrated

on:
  workflow_dispatch:
  push:
    branches: [experiment/physical-v6-full]
    paths: [experiments/structure_aware/TRIGGER_V6_COMPARATOR_FULL]

permissions:
  contents: read

jobs:
  train:
    name: ${{ matrix.method }} 25 jobs
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      # The three Kaggle accounts allow two concurrent kernels each and the
      # orchestrator claims all six slots, so methods must never overlap.
      max-parallel: 1
      matrix:
        method: [ddpg, ppo]
    env:
      KAGGLE_TD3_KEY: ${{ secrets.KAGGLE_TD3_KEY }}
      KAGGLE_DDPG_KEY: ${{ secrets.KAGGLE_DDPG_KEY }}
      KAGGLE_PPO_KEY: ${{ secrets.KAGGLE_PPO_KEY }}
      REPO_COMMIT: ${{ github.sha }}
      METHOD: ${{ matrix.method }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "kaggle>=1.8.4,<3"
      - name: Submit, monitor, and collect all 25 jobs
        run: |
          python scripts/orchestrate_kaggle_v6_full.py \
            --method "$METHOD" \
            --commit "$REPO_COMMIT" \
            --output-dir collected \
            --manifest "TRAINING_RUN_MANIFEST_${METHOD}.json" \
            --timeout-minutes 210
      - name: Upload complete V6 comparator evidence
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: physical-v6-full-25jobs-${{ matrix.method }}
          path: |
            TRAINING_RUN_MANIFEST_${{ matrix.method }}.json
            collected/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

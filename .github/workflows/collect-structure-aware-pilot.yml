name: Collect structure-aware TD3 pilot

on:
  workflow_dispatch:
  push:
    branches: [audit/ao-baseline-full-n128]
    paths: [experiments/structure_aware/COLLECT_NOW]

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "kaggle>=1.8.4,<3" pandas tabulate

      - name: Download four completed kernels
        env:
          TD3_KEY: ${{ secrets.KAGGLE_TD3_KEY }}
          DDPG_KEY: ${{ secrets.KAGGLE_DDPG_KEY }}
          PPO_KEY: ${{ secrets.KAGGLE_PPO_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          download() {
            local user="$1" key="$2" ref="$3" destination="$4"
            status="$(KAGGLE_USERNAME="$user" KAGGLE_KEY="$key" kaggle kernels status "$ref" 2>&1)"
            echo "$ref: $status"
            echo "$status" | grep -Eqi 'COMPLETE|SUCCESS' || exit 1
            mkdir -p "$destination"
            KAGGLE_USERNAME="$user" KAGGLE_KEY="$key" \
              kaggle kernels output "$ref" -p "$destination" --force
          }
          download thanhnguyen1423 "$TD3_KEY" \
            thanhnguyen1423/star-ris-td3-v5-hard-n32-seed-0 collected/hard_seed0
          download thanhnguyen1423 "$TD3_KEY" \
            thanhnguyen1423/star-ris-td3-v5-hard-n32-seed-1 collected/hard_seed1
          download ronganminh "$DDPG_KEY" \
            ronganminh/star-ris-td3-v5-soft-n32-seed-0 collected/soft_seed0
          download duythanhb1909984 "$PPO_KEY" \
            duythanhb1909984/star-ris-td3-v5-soft-n32-seed-1 collected/soft_seed1
          find collected -name '*.zip' -type f -print0 | while IFS= read -r -d '' archive; do
            unzip -oq "$archive" -d "${archive%.zip}_extracted"
          done

      - name: Audit and aggregate
        run: |
          python scripts/audit_structure_aware_pilot.py \
            --input collected --output structure_pilot_audit
          cat structure_pilot_audit/PILOT_REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: structure-aware-td3-pilot-n32
          path: |
            collected/
            structure_pilot_audit/
          retention-days: 90

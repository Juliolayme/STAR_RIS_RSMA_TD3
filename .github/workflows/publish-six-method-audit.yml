name: Publish audited six-method results

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - experiments/six_method/PUBLISH_AUDIT_NOW

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SOURCE_RUN_ID: "30422028560"
      SOURCE_ARTIFACT_ID: "8712801218"
      SOURCE_ARTIFACT_DIGEST: "sha256:9bae98f58e98d8c95fed9faea32ba558be741d605e51494f789447a4a5a6658b"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: experiments/drl-six-method-v1
          fetch-depth: 0

      - name: Download audited canonical artifact
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            > "$RUNNER_TEMP/evidence.zip"
          unzip -q "$RUNNER_TEMP/evidence.zip" -d "$RUNNER_TEMP/evidence"

      - name: Validate and locate audited report
        id: report
        run: |
          set -euo pipefail
          mapfile -t audits < <(find "$RUNNER_TEMP/evidence" -type f -path '*/six_method_v1/SIX_METHOD_AUDIT.json')
          if [[ ${#audits[@]} -ne 1 ]]; then
            printf 'Expected exactly one audit file, found %s\n' "${#audits[@]}" >&2
            printf '%s\n' "${audits[@]}" >&2
            exit 1
          fi
          audit="${audits[0]}"
          report_dir="$(dirname "$audit")"
          verdict=$(python - "$audit" <<'PY'
          import json
          import sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          print(payload.get("verdict", ""))
          PY
          )
          test "$verdict" = PASS
          test -f "$report_dir/TABLE_SIX_METHOD_PERFORMANCE.csv"
          test -f "$report_dir/TABLE_SIX_METHOD_CPU_LATENCY.csv"
          test -f "$report_dir/fig01_six_method_sum_rate.png"
          test -f "$report_dir/fig06_six_method_quality_latency.png"
          echo "report_dir=$report_dir" >> "$GITHUB_OUTPUT"

      - name: Publish report to experiment branch
        run: |
          set -euo pipefail
          report_dir="${{ steps.report.outputs.report_dir }}"
          rm -rf results/six_method_v1
          mkdir -p results/six_method_v1
          cp -a "$report_dir"/. results/six_method_v1/
          cat > results/six_method_v1/PUBLISH_SOURCE.json <<JSON
          {
            "source_run_id": ${SOURCE_RUN_ID},
            "source_artifact_id": ${SOURCE_ARTIFACT_ID},
            "source_artifact_digest": "${SOURCE_ARTIFACT_DIGEST}",
            "publication_method": "recovered_from_passed_canonical_artifact"
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/six_method_v1
          git commit -m "Publish audited canonical six-method benchmark results"
          git push origin HEAD:experiments/drl-six-method-v1

name: Publish audited final thesis results

on:
  workflow_dispatch:
  push:
    branches:
      - agent/td3-qos-scalability-v2
    paths:
      - ".github/workflows/publish-final-thesis-results.yml"

permissions:
  contents: write

jobs:
  publish-results:
    name: Audit and commit notebook 06 deliverables
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KAGGLE_PPO_KEY: ${{ secrets.KAGGLE_PPO_KEY }}
      FINAL_KERNEL_REF: duythanhb1909984/star-ris-final-academic-bundle
      TARGET_BRANCH: agent/td3-qos-scalability-v2

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/td3-qos-scalability-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade "kaggle>=1.8.4,<3" pandas numpy tabulate

      - name: Download final Kaggle output
        shell: bash
        run: |
          set -euo pipefail
          export KAGGLE_USERNAME="duythanhb1909984"
          export KAGGLE_KEY="${KAGGLE_PPO_KEY}"
          rm -rf .publish_final_output
          mkdir -p .publish_final_output
          kaggle kernels status "$FINAL_KERNEL_REF"
          kaggle kernels output "$FINAL_KERNEL_REF" -p .publish_final_output -o
          find .publish_final_output -type f -printf '%P\t%s bytes\n' | sort

      - name: Audit, review, and stage submission bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import datetime as dt
          import json
          import math
          import shutil
          from pathlib import Path

          import numpy as np
          import pandas as pd

          output_root = Path('.publish_final_output').resolve()
          results_root = Path('results').resolve()
          target_root = results_root / 'final_thesis_paper_bundle'

          candidates: list[Path] = []
          for readme in output_root.rglob('RESULTS_README.md'):
              root = readme.parent
              if (
                  (root / 'REPRODUCIBILITY_MANIFEST.json').exists()
                  and (root / 'tables').is_dir()
                  and (root / 'figures').is_dir()
                  and (root / 'raw').is_dir()
              ):
                  candidates.append(root)
          candidates = sorted(set(path.resolve() for path in candidates))
          if len(candidates) != 1:
              raise RuntimeError(f'Expected one final bundle directory, found {candidates}')
          source_root = candidates[0]
          print(f'Final bundle source: {source_root}')

          required = {
              'RESULTS_README.md': source_root / 'RESULTS_README.md',
              'REPRODUCIBILITY_MANIFEST.json': source_root / 'REPRODUCIBILITY_MANIFEST.json',
              'TABLE_FINAL_PERFORMANCE.csv': source_root / 'tables' / 'TABLE_FINAL_PERFORMANCE.csv',
              'TABLE_TD3_8SEED_CI95.csv': source_root / 'tables' / 'TABLE_TD3_8SEED_CI95.csv',
              'TABLE_PAIRED_WILCOXON_HOLM.csv': source_root / 'tables' / 'TABLE_PAIRED_WILCOXON_HOLM.csv',
              'TABLE_CPU_LATENCY.csv': source_root / 'tables' / 'TABLE_CPU_LATENCY.csv',
              'TABLE_BASELINE_SOLVER_TIME_DESCRIPTIVE.csv': source_root / 'tables' / 'TABLE_BASELINE_SOLVER_TIME_DESCRIPTIVE.csv',
              'TD3_TEST_RAW_ALL.csv': source_root / 'raw' / 'TD3_TEST_RAW_ALL.csv',
              'BASELINES_RAW_ALL.csv': source_root / 'raw' / 'BASELINES_RAW_ALL.csv',
              'LATENCY_RAW_ALL.csv': source_root / 'raw' / 'LATENCY_RAW_ALL.csv',
          }
          missing = [name for name, path in required.items() if not path.exists()]
          if missing:
              raise RuntimeError(f'Missing final deliverables: {missing}')

          fatal: list[str] = []
          caveats: list[str] = []
          expected_n = {16, 32, 64, 96, 128}
          expected_methods = {'td3', 'ao_sca', 'ao_grid', 'analytical_ris'}
          quality_metrics = ['sum_rate', 'qos_fraction', 'all_qos', 'violation']

          def finite(frame: pd.DataFrame, columns: list[str], context: str) -> None:
              absent = [column for column in columns if column not in frame.columns]
              if absent:
                  fatal.append(f'{context}: missing columns {absent}')
                  return
              values = frame[columns].apply(pd.to_numeric, errors='coerce').to_numpy(float)
              if not np.isfinite(values).all():
                  fatal.append(f'{context}: NaN/Inf detected in {columns}')

          manifest = json.loads(required['REPRODUCIBILITY_MANIFEST.json'].read_text(encoding='utf-8'))
          if manifest.get('n_values') != [16, 32, 64, 96, 128]:
              fatal.append(f"Manifest N coverage mismatch: {manifest.get('n_values')}")
          if manifest.get('td3_seeds') != list(range(8)):
              fatal.append(f"Manifest seed coverage mismatch: {manifest.get('td3_seeds')}")
          if manifest.get('test_scenarios_per_n') != 1000:
              fatal.append('Manifest test scenario count is not 1,000 per N')
          if manifest.get('latency_scenarios_per_n') != 1000:
              fatal.append('Manifest latency scenario count is not 1,000 per N')
          stages = manifest.get('stage_manifests', {})
          if not isinstance(stages, dict) or set(stages) != {
              'td3_low_n', 'td3_high_n', 'ao_grid', 'ao_sca', 'analytical_ris'
          }:
              fatal.append(f'Unexpected stage manifests: {sorted(stages) if isinstance(stages, dict) else stages}')

          performance = pd.read_csv(required['TABLE_FINAL_PERFORMANCE.csv'])
          performance['method'] = performance['method'].astype(str).str.lower()
          performance['n_ris'] = pd.to_numeric(performance['n_ris'], errors='raise').astype(int)
          pairs = set(zip(performance['method'], performance['n_ris']))
          expected_pairs = {(method, n) for method in expected_methods for n in expected_n}
          if len(performance) != 20 or pairs != expected_pairs:
              fatal.append(
                  f'Final performance coverage mismatch: rows={len(performance)}, '
                  f'missing={sorted(expected_pairs - pairs)}, extra={sorted(pairs - expected_pairs)}'
              )
          finite(
              performance,
              [f'{metric}_mean' for metric in quality_metrics]
              + [f'{metric}_std' for metric in quality_metrics],
              'TABLE_FINAL_PERFORMANCE',
          )
          if set(performance.loc[performance.method == 'td3', 'seeds'].astype(int)) != {8}:
              fatal.append('TD3 final table does not report eight seeds')
          if set(performance.loc[performance.method != 'td3', 'seeds'].astype(int)) != {1}:
              fatal.append('Baseline rows do not use deterministic one-run labels')
          for metric in ('qos_fraction', 'all_qos'):
              values = pd.to_numeric(performance[f'{metric}_mean'], errors='coerce')
              if ((values < 0) | (values > 1)).any():
                  fatal.append(f'{metric}_mean outside [0,1]')
          if (pd.to_numeric(performance['violation_mean'], errors='coerce') < 0).any():
              fatal.append('Negative violation mean')
          if (pd.to_numeric(performance['sum_rate_mean'], errors='coerce') <= 0).any():
              fatal.append('Non-positive sum-rate mean')

          td3_ci = pd.read_csv(required['TABLE_TD3_8SEED_CI95.csv'])
          if len(td3_ci) != 5 or set(td3_ci['n_ris'].astype(int)) != expected_n:
              fatal.append('TD3 CI table does not contain all five N values')
          for metric in quality_metrics:
              columns = [
                  f'{metric}_mean', f'{metric}_std',
                  f'{metric}_ci95_low', f'{metric}_ci95_high',
              ]
              finite(td3_ci, columns, f'TD3 CI {metric}')
              mean = pd.to_numeric(td3_ci[columns[0]], errors='coerce')
              low = pd.to_numeric(td3_ci[columns[2]], errors='coerce')
              high = pd.to_numeric(td3_ci[columns[3]], errors='coerce')
              if ((low > mean) | (mean > high)).any():
                  fatal.append(f'TD3 {metric} mean outside CI95')
          bounded_ci_outside = False
          for metric in ('qos_fraction', 'all_qos'):
              low = pd.to_numeric(td3_ci[f'{metric}_ci95_low'], errors='coerce')
              high = pd.to_numeric(td3_ci[f'{metric}_ci95_high'], errors='coerce')
              bounded_ci_outside |= bool(((low < 0) | (high > 1)).any())
          violation_low = pd.to_numeric(td3_ci['violation_ci95_low'], errors='coerce')
          bounded_ci_outside |= bool((violation_low < 0).any())
          if bounded_ci_outside:
              caveats.append(
                  'Some Student-t confidence limits for bounded QoS metrics extend outside their physical range. '
                  'Keep the unmodified values for reproducibility, but clip only the visual display or use bootstrap/binomial intervals in the thesis.'
              )

          stats = pd.read_csv(required['TABLE_PAIRED_WILCOXON_HOLM.csv'])
          if len(stats) != 15:
              fatal.append(f'Expected 15 baseline-by-N tests, found {len(stats)}')
          p_columns = [
              'paired_t_p_value', 'wilcoxon_p_value',
              'paired_t_p_holm', 'wilcoxon_p_holm',
          ]
          finite(stats, p_columns, 'Statistical test p-values')
          for column in p_columns:
              values = pd.to_numeric(stats[column], errors='coerce')
              if not ((values >= 0) & (values <= 1)).all():
                  fatal.append(f'Invalid p-value range in {column}')
          t_holm_significant = int((stats['paired_t_p_holm'] < 0.05).sum())
          wilcoxon_holm_significant = int((stats['wilcoxon_p_holm'] < 0.05).sum())
          if wilcoxon_holm_significant == 0:
              caveats.append(
                  'No comparison remains significant under exact Wilcoxon-Holm correction at alpha=0.05. '
                  'The paired t-Holm results are significant, but with eight training seeds the paper must report both tests and avoid an unconditional significance claim.'
              )

          latency = pd.read_csv(required['TABLE_CPU_LATENCY.csv'])
          if len(latency) != 5 or set(latency['n_ris'].astype(int)) != expected_n:
              fatal.append('CPU latency table does not contain all five N values')
          latency_columns = [
              'td3_mean_ms', 'ao_sca_mean_ms', 'ao_grid_mean_ms', 'analytical_ris_mean_ms'
          ]
          finite(latency, latency_columns, 'CPU latency table')
          if (latency[latency_columns].apply(pd.to_numeric) <= 0).any().any():
              fatal.append('CPU latency contains non-positive values')

          baseline_timing = pd.read_csv(required['TABLE_BASELINE_SOLVER_TIME_DESCRIPTIVE.csv'])
          if len(baseline_timing) != 15:
              fatal.append(f'Expected 15 baseline timing rows, found {len(baseline_timing)}')

          td3_raw = pd.read_csv(required['TD3_TEST_RAW_ALL.csv'])
          if len(td3_raw) != 40000:
              fatal.append(f'Expected 40,000 TD3 test rows, found {len(td3_raw)}')
          finite(td3_raw, ['scenario', 'n_ris', 'seed', *quality_metrics], 'TD3 raw test data')
          expected_td3_pairs = {(n, seed) for n in expected_n for seed in range(8)}
          actual_td3_pairs = set(zip(td3_raw['n_ris'].astype(int), td3_raw['seed'].astype(int)))
          if actual_td3_pairs != expected_td3_pairs:
              fatal.append('TD3 raw N/seed coverage mismatch')
          for (n, seed), group in td3_raw.groupby(['n_ris', 'seed'], sort=True):
              scenarios = sorted(group['scenario'].astype(int).tolist())
              if len(group) != 1000 or scenarios != list(range(1000)):
                  fatal.append(f'Incomplete TD3 scenario coverage N={n}, seed={seed}')
                  break

          baseline_raw = pd.read_csv(required['BASELINES_RAW_ALL.csv'])
          if len(baseline_raw) != 15000:
              fatal.append(f'Expected 15,000 baseline rows, found {len(baseline_raw)}')
          finite(
              baseline_raw,
              ['scenario', 'n_ris', 'sum_rate', 'qos_fraction', 'all_qos', 'violation', 'solve_ms'],
              'Baseline raw data',
          )

          latency_raw = pd.read_csv(required['LATENCY_RAW_ALL.csv'])
          if len(latency_raw) != 5000:
              fatal.append(f'Expected 5,000 latency rows, found {len(latency_raw)}')

          figures = sorted((source_root / 'figures').glob('*.png'))
          pdf_figures = sorted((source_root / 'figures').glob('*.pdf'))
          if len(figures) != 12 or len(pdf_figures) != 12:
              fatal.append(
                  f'Expected 12 PNG and 12 PDF figures, found {len(figures)} PNG and {len(pdf_figures)} PDF'
              )

          td3 = performance[performance.method == 'td3'].set_index('n_ris').sort_index()
          ao_sca = performance[performance.method == 'ao_sca'].set_index('n_ris').sort_index()
          ao_grid = performance[performance.method == 'ao_grid'].set_index('n_ris').sort_index()
          analytical = performance[performance.method == 'analytical_ris'].set_index('n_ris').sort_index()

          td3_qos_min = float(td3.qos_fraction_mean.min())
          td3_qos_max = float(td3.qos_fraction_mean.max())
          td3_all_qos_min = float(td3.all_qos_mean.min())
          td3_all_qos_max = float(td3.all_qos_mean.max())
          td3_sum_start = float(td3.loc[16, 'sum_rate_mean'])
          td3_sum_end = float(td3.loc[128, 'sum_rate_mean'])
          td3_vs_grid = (td3.sum_rate_mean / ao_grid.sum_rate_mean - 1.0) * 100.0
          td3_vs_analytical = (td3.sum_rate_mean / analytical.sum_rate_mean - 1.0) * 100.0
          td3_vs_sca_gap = ao_sca.sum_rate_mean - td3.sum_rate_mean
          sca_ratio = latency.set_index('n_ris')['ao_sca_over_td3']
          grid_ratio = latency.set_index('n_ris')['ao_grid_over_td3']
          analytical_faster = 1.0 / latency.set_index('n_ris')['analytical_ris_over_td3']

          caveats.extend([
              'AO-SCA achieves the highest sum-rate at every N; TD3 must not be presented as the best-quality method.',
              'AnalyticalRIS is faster than TD3 but fails QoS in this experiment; TD3 must not be called the fastest absolute method.',
              'AO-Grid and AnalyticalRIS are weak quality baselines here. A Q1 submission should justify their parameterization and add ablations or stronger learning baselines where possible.',
          ])

          if fatal:
              raise RuntimeError('Final output audit failed:\n- ' + '\n- '.join(fatal))

          audit = {
              'verdict': 'PASS_WITH_CAVEATS',
              'approved_for_thesis_integration': True,
              'q1_paper_positioning': 'quality-latency trade-off; not overall superiority',
              'fatal_errors': fatal,
              'caveats': caveats,
              'source_kernel': 'duythanhb1909984/star-ris-final-academic-bundle',
              'scientific_algorithm_commit': manifest.get('scientific_algorithm_commit'),
              'report_generation_commit': manifest.get('report_generation_commit'),
              'td3_qos_fraction_range': [td3_qos_min, td3_qos_max],
              'td3_all_qos_range': [td3_all_qos_min, td3_all_qos_max],
              'td3_sum_rate_n16': td3_sum_start,
              'td3_sum_rate_n128': td3_sum_end,
              'td3_vs_ao_grid_percent_range': [float(td3_vs_grid.min()), float(td3_vs_grid.max())],
              'td3_vs_analytical_percent_range': [float(td3_vs_analytical.min()), float(td3_vs_analytical.max())],
              'ao_sca_minus_td3_sum_rate_range': [float(td3_vs_sca_gap.min()), float(td3_vs_sca_gap.max())],
              'ao_sca_over_td3_latency_range': [float(sca_ratio.min()), float(sca_ratio.max())],
              'ao_grid_over_td3_latency_range': [float(grid_ratio.min()), float(grid_ratio.max())],
              'analytical_ris_faster_than_td3_range': [float(analytical_faster.min()), float(analytical_faster.max())],
              'paired_t_holm_significant_count': t_holm_significant,
              'wilcoxon_holm_significant_count': wilcoxon_holm_significant,
              'generated_utc': dt.datetime.now(dt.timezone.utc).isoformat(),
          }

          if target_root.exists():
              shutil.rmtree(target_root)
          results_root.mkdir(parents=True, exist_ok=True)
          shutil.copytree(source_root, target_root)

          bundle_zips = sorted(output_root.rglob('FINAL_THESIS_PAPER_BUNDLE.zip'))
          if len(bundle_zips) != 1:
              raise RuntimeError(f'Expected one final ZIP archive, found {bundle_zips}')
          shutil.copy2(bundle_zips[0], results_root / 'FINAL_THESIS_PAPER_BUNDLE.zip')

          (results_root / 'FINAL_RESULTS_AUDIT.json').write_text(
              json.dumps(audit, indent=2, ensure_ascii=False), encoding='utf-8'
          )

          review_lines = [
              '# Final Results — Senior Reviewer Assessment',
              '',
              '**Decision:** Accept for thesis integration with mandatory interpretation caveats.',
              '',
              '## Evidence integrity',
              '',
              '- Five STAR-RIS sizes: N = 16, 32, 64, 96, 128.',
              '- TD3: 8 independent training seeds per N and 1,000 locked test scenarios per seed.',
              '- Deterministic baselines: 1,000 matched scenarios per N.',
              '- Raw coverage, finite-value, checksum/provenance, table, figure, and CPU-timing audits passed.',
              f"- Scientific algorithm commit: `{manifest.get('scientific_algorithm_commit')}`.",
              f"- Report-generation commit: `{manifest.get('report_generation_commit')}`.",
              '',
              '## Thesis-ready findings',
              '',
              f'- TD3 mean QoS fraction ranges from **{td3_qos_min:.4f}** to **{td3_qos_max:.4f}**.',
              f'- TD3 all-users-QoS probability ranges from **{td3_all_qos_min:.4f}** to **{td3_all_qos_max:.4f}**.',
              f'- TD3 mean sum-rate changes from **{td3_sum_start:.4f}** at N=16 to **{td3_sum_end:.4f}** at N=128.',
              f'- Against AO-Grid, TD3 sum-rate improvement ranges from **{td3_vs_grid.min():.1f}%** to **{td3_vs_grid.max():.1f}%**.',
              f'- Against AnalyticalRIS, TD3 sum-rate improvement ranges from **{td3_vs_analytical.min():.1f}%** to **{td3_vs_analytical.max():.1f}%**.',
              f'- AO-SCA exceeds TD3 sum-rate by **{td3_vs_sca_gap.min():.4f}–{td3_vs_sca_gap.max():.4f}**; this quality gap must be reported.',
              f'- TD3 is **{sca_ratio.min():.0f}×–{sca_ratio.max():.0f}×** faster than AO-SCA and **{grid_ratio.min():.0f}×–{grid_ratio.max():.0f}×** faster than AO-Grid in the declared single-process CPU benchmark.',
              f'- AnalyticalRIS is approximately **{analytical_faster.min():.2f}×–{analytical_faster.max():.2f}×** faster than TD3, but it fails QoS in the reported experiment.',
              '',
              '## Statistical interpretation',
              '',
              f'- Paired t-test with Holm correction: **{t_holm_significant}/15** comparisons significant at alpha=0.05.',
              f'- Exact Wilcoxon with Holm correction: **{wilcoxon_holm_significant}/15** comparisons significant at alpha=0.05.',
              '- Therefore, do not write an unconditional “statistically significant under both tests” claim.',
              '- Report effect sizes, paired mean differences, both corrected tests, and the eight-seed limitation together.',
              '',
              '## Mandatory writing guardrails',
              '',
              '- Position TD3 as a **QoS-reliable, low-latency compromise**, not the maximum-sum-rate method.',
              '- State explicitly that AO-SCA is a local iterative baseline, not a global optimum or upper bound.',
              '- Do not call TD3 the fastest absolute method because AnalyticalRIS is faster.',
              '- Explain that unbounded Student-t intervals can cross [0,1] for bounded metrics; preserve raw values and use clipped display or bounded/bootstrap intervals in the thesis.',
              '- For a Q1 paper, justify weak baseline behavior and add ablations/stronger learning baselines before making broad superiority claims.',
              '',
              '## Repository contents',
              '',
              '- `final_thesis_paper_bundle/`: figures, tables, raw evidence, and reproducibility manifest.',
              '- `FINAL_THESIS_PAPER_BUNDLE.zip`: submission-ready archive downloaded from Kaggle.',
              '- `FINAL_RESULTS_AUDIT.json`: machine-readable audit and reviewer decision.',
          ]
          (results_root / 'FINAL_RESULTS_REVIEW.md').write_text(
              '\n'.join(review_lines) + '\n', encoding='utf-8'
          )

          print(json.dumps(audit, indent=2, ensure_ascii=False))
          print(f'Staged results directory: {results_root}')
          PY

      - name: Commit audited results to repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .publish_final_output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/final_thesis_paper_bundle
          git add -f results/FINAL_THESIS_PAPER_BUNDLE.zip
          git add -f results/FINAL_RESULTS_AUDIT.json
          git add -f results/FINAL_RESULTS_REVIEW.md
          if git diff --cached --quiet; then
            echo "No final result changes to commit."
            exit 0
          fi
          git commit -m "Publish audited final thesis and paper results"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Write publication summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Final results publication"
            echo
            echo "- Kaggle kernel: \`${FINAL_KERNEL_REF}\`"
            echo "- Repository directory: \`results/final_thesis_paper_bundle\`"
            echo "- Reviewer decision: thesis-ready with interpretation caveats"
            echo "- Paper positioning: quality-latency trade-off"
          } >> "$GITHUB_STEP_SUMMARY"

name: One-shot repair thesis figure PDFs

on:
  push:
    branches:
      - thesis/build-check-4chap
    paths:
      - "thesis/TRIGGER_PDF_REPAIR"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: thesis/build-check-4chap
          fetch-depth: 0
      - name: Install PDF repair tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ghostscript poppler-utils
      - name: Normalize all thesis figure PDFs
        run: |
          set -euo pipefail
          for pdf in thesis/figures/pdf/*.pdf; do
            tmp="${pdf%.pdf}.repaired.pdf"
            gs -q -dNOPAUSE -dBATCH -dSAFER \
              -sDEVICE=pdfwrite \
              -dCompatibilityLevel=1.7 \
              -dPDFSETTINGS=/prepress \
              -dDetectDuplicateImages=true \
              -dCompressFonts=true \
              -sOutputFile="$tmp" "$pdf"
            mv "$tmp" "$pdf"
            pdfinfo "$pdf" | grep -E 'Pages|PDF version|Page size'
          done
          rm -f thesis/TRIGGER_PDF_REPAIR
          rm -f .github/workflows/repair-thesis-figure-pdfs.yml
      - name: Commit repaired vector figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A thesis/figures/pdf thesis/TRIGGER_PDF_REPAIR .github/workflows/repair-thesis-figure-pdfs.yml
          git commit -m "Normalize Draw.io figure PDFs for XeLaTeX compatibility"
          git push origin HEAD:thesis/build-check-4chap

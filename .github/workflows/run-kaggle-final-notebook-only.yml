name: Verify existing stage dataset and run final notebook

on:
  workflow_dispatch:
  push:
    branches:
      - agent/td3-qos-scalability-v2
    paths:
      - ".github/workflows/run-kaggle-final-notebook-only.yml"

permissions:
  contents: read

jobs:
  verify-and-run-final:
    name: Verify V2 stage dataset and run notebook 06
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KAGGLE_PPO_KEY: ${{ secrets.KAGGLE_PPO_KEY }}
      FINAL_DATASET_REF: duythanhb1909984/star-ris-stage-outputs-final-v2
      FINAL_KERNEL_REF: duythanhb1909984/star-ris-final-academic-bundle
      KAGGLE_ACCELERATOR: NvidiaTeslaT4
      KAGGLE_TIMEOUT_SECONDS: "43200"

    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade "kaggle>=1.8.4,<3"

      - name: Verify existing V2 dataset contents
        shell: bash
        run: |
          set -euo pipefail
          export KAGGLE_USERNAME="duythanhb1909984"
          export KAGGLE_KEY="${KAGGLE_PPO_KEY}"

          required=(
            td3_low_n.zip
            td3_high_n.zip
            ao_grid.zip
            ao_sca.zip
            analytical_ris.zip
          )

          verified="false"
          for attempt in $(seq 1 60); do
            set +e
            files="$(kaggle datasets files "$FINAL_DATASET_REF" 2>&1)"
            rc=$?
            set -e
            printf '%s\n' "$files"

            if [[ $rc -eq 0 ]]; then
              missing="false"
              for archive in "${required[@]}"; do
                if ! grep -Fq "$archive" <<<"$files"; then
                  echo "Dataset probe missing: $archive"
                  missing="true"
                fi
              done
              if [[ "$missing" == "false" ]]; then
                verified="true"
                break
              fi
            fi

            echo "Dataset not fully readable yet (attempt ${attempt}/60); retrying..."
            sleep 10
          done

          if [[ "$verified" != "true" ]]; then
            echo "Dataset verification failed: $FINAL_DATASET_REF" >&2
            exit 1
          fi

          echo "Verified all five audited stage archives in $FINAL_DATASET_REF"

      - name: Prepare notebook 06 with V2 dataset
        shell: bash
        run: |
          set -euo pipefail
          stage=".kaggle_push/duythanhb1909984/star-ris-final-academic-bundle"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp kaggle_notebooks/06_final_academic_report_and_benchmark.ipynb \
            "$stage/06_final_academic_report_and_benchmark.ipynb"

          STAGE_DIR="$stage" python - <<'PY'
          import json
          import os
          from pathlib import Path

          stage = Path(os.environ["STAGE_DIR"])
          notebook_path = stage / "06_final_academic_report_and_benchmark.ipynb"
          notebook = json.loads(notebook_path.read_text(encoding="utf-8"))
          source = "\n".join(
              "".join(cell.get("source", [])) for cell in notebook.get("cells", [])
          )
          expected_report_commit = "b67adee55def9dbc32c8acded09dad68c51ee49a"
          if expected_report_commit not in source:
              raise RuntimeError(
                  f"Notebook 06 is not pinned to report commit {expected_report_commit}"
              )

          metadata = {
              "id": "duythanhb1909984/star-ris-final-academic-bundle",
              "title": "STAR RIS Final Academic Bundle",
              "code_file": "06_final_academic_report_and_benchmark.ipynb",
              "language": "python",
              "kernel_type": "notebook",
              "is_private": True,
              "enable_gpu": True,
              "enable_tpu": False,
              "enable_internet": True,
              "dataset_sources": [
                  "duythanhb1909984/star-ris-stage-outputs-final-v2"
              ],
              "competition_sources": [],
              "kernel_sources": [],
              "model_sources": [],
          }
          (stage / "kernel-metadata.json").write_text(
              json.dumps(metadata, indent=2), encoding="utf-8"
          )
          print(json.dumps(metadata, indent=2))
          PY

      - name: Push and run notebook 06
        shell: bash
        run: |
          set -euo pipefail
          export KAGGLE_USERNAME="duythanhb1909984"
          export KAGGLE_KEY="${KAGGLE_PPO_KEY}"

          kaggle kernels push \
            --path ".kaggle_push/duythanhb1909984/star-ris-final-academic-bundle" \
            --accelerator "$KAGGLE_ACCELERATOR" \
            --timeout "$KAGGLE_TIMEOUT_SECONDS"

          kaggle kernels status "$FINAL_KERNEL_REF" || true

      - name: Write submission summary
        if: always()
        shell: bash
        run: |
          {
            echo "## STAR-RIS final notebook submission"
            echo
            echo "- Dataset: \`$FINAL_DATASET_REF\`"
            echo "- Required archives: verified before submission"
            echo "- Notebook: \`$FINAL_KERNEL_REF\`"
            echo "- Cross-account kernel sources: disabled"
            echo "- Report commit: \`b67adee55def9dbc32c8acded09dad68c51ee49a\`"
          } >> "$GITHUB_STEP_SUMMARY"

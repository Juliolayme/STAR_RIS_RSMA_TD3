name: Pilot corrected AO v2 stationarity

on:
  workflow_dispatch:
  push:
    branches:
      - audit/ao-baseline-full-n128
    paths:
      - .github/workflows/audit-pairwise80-n128.yml

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: src
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

concurrency:
  group: corrected-ao-v2-stationarity-pilot
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and test dependency
        run: pip install -e . pytest
      - name: Test corrected AO stopping criterion
        run: pytest -q tests/test_ao_corrected.py

  pilot:
    needs: preflight
    name: AO-v2 N${{ matrix.n }} ${{ matrix.chunk }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        n: [16, 32]
        chunk:
          - '0000-0100'
          - '0100-0200'
          - '0200-0300'
          - '0300-0400'
          - '0400-0500'
          - '0500-0600'
          - '0600-0700'
          - '0700-0800'
          - '0800-0900'
          - '0900-1000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package
        run: pip install -e .
      - name: Run locked AO-v2 pilot chunk
        env:
          N_RIS: ${{ matrix.n }}
          CHUNK: ${{ matrix.chunk }}
        run: |
          set -euo pipefail
          START=$((10#${CHUNK%-*}))
          END=$((10#${CHUNK#*-}))
          mkdir -p pilot_chunk
          python scripts/run_corrected_baseline.py \
            --method ao_sca --n-ris "$N_RIS" \
            --start "$START" --end "$END" \
            --output "pilot_chunk/ao_sca_v2_N${N_RIS}_${CHUNK}.csv"
      - uses: actions/upload-artifact@v4
        with:
          name: ao-v2-pilot-N${{ matrix.n }}-${{ matrix.chunk }}
          path: pilot_chunk/*.csv
          retention-days: 14
          if-no-files-found: error

  validate:
    needs: pilot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package
        run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: ao-v2-pilot-*
          path: collected
          merge-multiple: true
      - name: Validate 2,000 stationarity results
        run: |
          python scripts/validate_ao_stationarity_pilot.py \
            --input-root collected \
            --output pilot_audit/AO_V2_STATIONARITY_AUDIT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AO_V2_STATIONARITY_PILOT
          path: pilot_audit/**
          retention-days: 30
          if-no-files-found: error

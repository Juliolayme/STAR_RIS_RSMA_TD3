name: Collect and publish six-method benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: collect-six-method-benchmark-v1
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: experiments/drl-six-method-v1
          fetch-depth: 0

      - name: Stop when audited result is already published
        id: published
        run: |
          if [[ -f results/six_method_v1/SIX_METHOD_AUDIT.json ]]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "Six-method result is already present on the experiment branch."
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.published.outputs.done != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        if: steps.published.outputs.done != 'true'
        run: python -m pip install "kaggle>=1.8.4,<3"

      - name: Check six kernels and download completed outputs
        if: steps.published.outputs.done != 'true'
        id: download
        env:
          TD3_USER: thanhnguyen1423
          TD3_KEY: ${{ secrets.KAGGLE_TD3_KEY }}
          DDPG_USER: ronganminh
          DDPG_KEY: ${{ secrets.KAGGLE_DDPG_KEY }}
          PPO_USER: duythanhb1909984
          PPO_KEY: ${{ secrets.KAGGLE_PPO_KEY }}
        run: |
          set -euo pipefail
          rm -rf collected
          mkdir -p collected/drl collected/baselines

          check_kernel() {
            local user="$1"
            local key="$2"
            local ref="$3"
            local status
            status=$(KAGGLE_USERNAME="$user" KAGGLE_KEY="$key" kaggle kernels status "$ref" 2>&1 || true)
            echo "$ref: $status"
            if echo "$status" | grep -Eqi "ERROR|CANCELLED|CANCELED|FAILED"; then
              echo "Kernel failed: $ref" >&2
              exit 1
            fi
            if ! echo "$status" | grep -Eqi "COMPLETE"; then
              return 1
            fi
            return 0
          }

          all_ready=true
          while IFS='|' read -r user key ref destination; do
            if check_kernel "$user" "$key" "$ref"; then
              mkdir -p "$destination"
              KAGGLE_USERNAME="$user" KAGGLE_KEY="$key" \
                kaggle kernels output "$ref" -p "$destination"
            else
              all_ready=false
            fi
          done <<EOF
          ${TD3_USER}|${TD3_KEY}|thanhnguyen1423/star-ris-td3-sixmethod-low-n-v1|collected/drl/td3_low_n
          ${TD3_USER}|${TD3_KEY}|thanhnguyen1423/star-ris-td3-sixmethod-high-n-v1|collected/drl/td3_high_n
          ${DDPG_USER}|${DDPG_KEY}|ronganminh/star-ris-ddpg-sixmethod-low-n-v1|collected/drl/ddpg_low_n
          ${DDPG_USER}|${DDPG_KEY}|ronganminh/star-ris-ddpg-sixmethod-high-n-v1|collected/drl/ddpg_high_n
          ${PPO_USER}|${PPO_KEY}|duythanhb1909984/star-ris-ppo-sixmethod-low-n-v1|collected/drl/ppo_low_n
          ${PPO_USER}|${PPO_KEY}|duythanhb1909984/star-ris-ppo-sixmethod-high-n-v1|collected/drl/ppo_high_n
          EOF

          if [[ "$all_ready" != true ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "At least one DRL stage is still running; the hourly collector will retry."
            exit 0
          fi

          KAGGLE_USERNAME="$DDPG_USER" KAGGLE_KEY="$DDPG_KEY" \
            kaggle kernels output ronganminh/star-ris-ao-grid-final -p collected/baselines/ao_grid
          KAGGLE_USERNAME="$DDPG_USER" KAGGLE_KEY="$DDPG_KEY" \
            kaggle kernels output ronganminh/star-ris-ao-sca-final -p collected/baselines/ao_sca
          KAGGLE_USERNAME="$PPO_USER" KAGGLE_KEY="$PPO_KEY" \
            kaggle kernels output duythanhb1909984/star-ris-analytical-ris-final -p collected/baselines/analytical_ris
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Validate stage provenance and resolve scientific commit
        if: steps.download.outputs.ready == 'true'
        id: provenance
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          required = {
              "td3_low_n", "td3_high_n", "ddpg_low_n", "ddpg_high_n",
              "ppo_low_n", "ppo_high_n",
          }
          manifests = []
          for path in Path("collected/drl").rglob("STAGE_MANIFEST.json"):
              item = json.loads(path.read_text(encoding="utf-8"))
              if item.get("stage_id") in required:
                  manifests.append(item)
          stage_ids = {item["stage_id"] for item in manifests}
          if stage_ids != required:
              raise SystemExit(f"Stage manifest mismatch: {stage_ids}")
          commits = {item.get("repository_commit") for item in manifests}
          protocols = {item.get("training_protocol") for item in manifests}
          if len(commits) != 1:
              raise SystemExit(f"Different DRL commits: {commits}")
          if protocols != {"drl_v3_qos_constrained_fair"}:
              raise SystemExit(f"Unexpected protocols: {protocols}")
          print(f"stage_commit={next(iter(commits))}")
          PY

      - name: Checkout exact scientific commit and install
        if: steps.download.outputs.ready == 'true'
        run: |
          set -euo pipefail
          git checkout --detach "${{ steps.provenance.outputs.stage_commit }}"
          python -m pip install --no-build-isolation -e ".[dev]" tabulate

      - name: Recreate locked banks and verify checksums
        if: steps.download.outputs.ready == 'true'
        run: |
          set -euo pipefail
          mkdir -p artifacts/scenario_banks
          for n in 16 32 64 96 128; do
            python scripts/create_scenario_banks.py \
              --config "configs/v3/constrained_action_n${n}.yaml" \
              --output-dir artifacts/scenario_banks \
              --train-count 10000 \
              --validation-count 1000 \
              --test-count 1000
          done
          python - <<'PY'
          import json
          from pathlib import Path
          from star_ris_rsma.config import ExperimentConfig
          from star_ris_rsma.scenario_bank import ScenarioBank

          manifests = [
              json.loads(path.read_text(encoding="utf-8"))
              for path in Path("collected/drl").rglob("STAGE_MANIFEST.json")
          ]
          for n in (16, 32, 64, 96, 128):
              cfg = ExperimentConfig.from_yaml(f"configs/v3/constrained_action_n{n}.yaml")
              observed = ScenarioBank.load(f"artifacts/scenario_banks/N{n}_test.npz", cfg).checksum()
              declared = {
                  item["scenario_bank_checksums"][str(n)]["test"]
                  for item in manifests
                  if str(n) in item["scenario_bank_checksums"]
              }
              if declared != {observed}:
                  raise SystemExit(f"N={n} checksum mismatch: declared={declared}, observed={observed}")
              print(f"N={n} test bank checksum verified: {observed}")
          PY

      - name: Benchmark all six methods on one CPU runner
        if: steps.download.outputs.ready == 'true'
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          rm -rf collected/latency
          mkdir -p collected/latency
          for n in 16 32 64 96 128; do
            config="configs/v3/constrained_action_n${n}.yaml"
            bank="artifacts/scenario_banks/N${n}_test.npz"
            for method in td3 ddpg ppo; do
              mapfile -t checkpoints < <(find collected/drl -type f -path "*/final_${method}_v3/N${n}/seed_0/train/best.pt")
              if [[ ${#checkpoints[@]} -ne 1 ]]; then
                echo "Expected one seed-0 checkpoint for ${method} N=${n}, found ${#checkpoints[@]}" >&2
                exit 1
              fi
              output="collected/latency/${method}_N${n}.csv"
              python scripts/benchmark_latency.py \
                --method "$method" --config "$config" --bank "$bank" \
                --checkpoint "${checkpoints[0]}" --seed 0 --warmup 10 --count 100 \
                --output "$output"
            done
            for method in ao_sca ao_grid analytical_ris; do
              output="collected/latency/${method}_N${n}.csv"
              python scripts/benchmark_latency.py \
                --method "$method" --config "$config" --bank "$bank" \
                --seed 0 --warmup 10 --count 100 --output "$output"
            done
          done
          python - <<'PY'
          import re
          from pathlib import Path
          import pandas as pd

          for path in Path("collected/latency").glob("*.csv"):
              match = re.search(r"_N(\d+)\.csv$", path.name)
              if not match:
                  raise SystemExit(f"Cannot parse N from {path}")
              frame = pd.read_csv(path)
              frame.insert(1, "n_ris", int(match.group(1)))
              frame.to_csv(path, index=False)
          PY

      - name: Generate audited six-method tables and figures
        if: steps.download.outputs.ready == 'true'
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/six_method_v1"
          rm -rf "$report"
          python scripts/build_six_method_report.py \
            --drl-root collected/drl \
            --baseline-root collected/baselines \
            --latency-root collected/latency \
            --output "$report"

          mkdir -p "$report/convergence" "$report/raw/convergence"
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path
          import os

          report = Path(os.environ["RUNNER_TEMP"]) / "six_method_v1"
          for manifest_path in Path("collected/drl").rglob("STAGE_MANIFEST.json"):
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              stage_id = manifest.get("stage_id")
              if not stage_id:
                  continue
              for figure in (manifest_path.parent / "figures").glob("*"):
                  if figure.is_file():
                      shutil.copy2(figure, report / "convergence" / f"{stage_id}_{figure.name}")
              for raw in manifest_path.parent.glob("*_TRAINING_RAW.csv"):
                  shutil.copy2(raw, report / "raw" / "convergence" / f"{stage_id}_{raw.name}")
              for raw in manifest_path.parent.glob("*_VALIDATION_RAW.csv"):
                  shutil.copy2(raw, report / "raw" / "convergence" / f"{stage_id}_{raw.name}")
          PY
          test "$(python -c 'import json,os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"six_method_v1","SIX_METHOD_AUDIT.json")))["verdict"])')" = PASS

      - name: Upload complete collected evidence
        if: steps.download.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: star-ris-six-method-complete-evidence
          path: |
            collected
            ${{ runner.temp }}/six_method_v1
          if-no-files-found: error
          retention-days: 30

      - name: Commit audited report to experiment branch
        if: steps.download.outputs.ready == 'true'
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/six_method_v1"
          git fetch origin experiments/drl-six-method-v1
          git checkout experiments/drl-six-method-v1
          rm -rf results/six_method_v1
          mkdir -p results
          cp -a "$report" results/six_method_v1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/six_method_v1
          git commit -m "Publish audited TD3 DDPG PPO six-method results"
          git push origin HEAD:experiments/drl-six-method-v1

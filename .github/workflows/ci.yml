name: CI

on:
  push:
    branches: [main, experiment/physical-v6-full]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --no-build-isolation -e .[dev]
      - run: pytest -q

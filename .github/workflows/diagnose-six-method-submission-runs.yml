name: Diagnose six-method submission runs

on:
  push:
    branches:
      - main
    paths:
      - experiments/six_method/DIAGNOSE_NOW
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SCIENTIFIC_COMMIT: 99318fefa53bef91fa5f105ec71ddae73fc96c39
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Query workflow runs for scientific commit
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/six_method_submission_diagnostic"
          rm -rf "$out"
          mkdir -p "$out/logs"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SCIENTIFIC_COMMIT}&per_page=100" \
            > "$out/runs_raw.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "six_method_submission_diagnostic"
          payload = json.loads((root / "runs_raw.json").read_text(encoding="utf-8"))
          rows = []
          for run in payload.get("workflow_runs", []):
              rows.append({
                  "id": run.get("id"),
                  "name": run.get("name"),
                  "event": run.get("event"),
                  "status": run.get("status"),
                  "conclusion": run.get("conclusion"),
                  "head_sha": run.get("head_sha"),
                  "head_branch": run.get("head_branch"),
                  "html_url": run.get("html_url"),
                  "created_at": run.get("created_at"),
                  "updated_at": run.get("updated_at"),
              })
          result = {
              "scientific_commit": os.environ["SCIENTIFIC_COMMIT"],
              "run_count": len(rows),
              "runs": sorted(rows, key=lambda item: (item.get("name") or "", item.get("id") or 0)),
          }
          (root / "SUBMISSION_RUNS.json").write_text(json.dumps(result, indent=2), encoding="utf-8")
          print(json.dumps(result, indent=2))
          PY

          mapfile -t run_ids < <(python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "six_method_submission_diagnostic"
          data = json.loads((root / "SUBMISSION_RUNS.json").read_text())
          for run in data["runs"]:
              name = (run.get("name") or "").lower()
              if "six-method" in name or "six method" in name:
                  print(run["id"])
          PY
          )
          for run_id in "${run_ids[@]}"; do
            gh run view "$run_id" --json databaseId,name,status,conclusion,event,headSha,headBranch,url,jobs \
              > "$out/logs/run_${run_id}_summary.json" || true
            gh run view "$run_id" --log > "$out/logs/run_${run_id}.log" 2>&1 || true
          done

      - name: Persist diagnostics on experiment branch
        run: |
          set -euo pipefail
          git fetch origin experiments/drl-six-method-v1
          git checkout experiments/drl-six-method-v1
          target="experiments/six_method/submission_diagnostic"
          rm -rf "$target"
          mkdir -p "$target"
          cp -a "$RUNNER_TEMP/six_method_submission_diagnostic/." "$target/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "Record six-method Kaggle submission workflow diagnostics" || true
          git push origin HEAD:experiments/drl-six-method-v1

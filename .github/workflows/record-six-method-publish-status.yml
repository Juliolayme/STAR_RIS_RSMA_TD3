name: Record six-method publish status

on:
  push:
    branches:
      - main
    paths:
      - experiments/six_method/RECORD_PUBLISH_STATUS
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record latest publisher runs
        run: |
          set -euo pipefail
          mkdir -p experiments/six_method
          gh run list \
            --workflow publish-six-method-audit.yml \
            --limit 5 \
            --json databaseId,status,conclusion,headSha,event,url,createdAt,updatedAt \
            > experiments/six_method/PUBLISH_WORKFLOW_STATUS.json
          cat experiments/six_method/PUBLISH_WORKFLOW_STATUS.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f experiments/six_method/PUBLISH_WORKFLOW_STATUS.json
          git commit -m "Record six-method publisher workflow status" || true
          git push origin HEAD:main

name: Kaggle V6 single TD3 job

on:
  workflow_call:
    inputs:
      n_ris:
        required: true
        type: number
      seed:
        required: true
        type: number
      kaggle_username:
        required: true
        type: string
      account_label:
        required: true
        type: string
    secrets:
      kaggle_key:
        required: true

permissions:
  contents: read

jobs:
  train:
    name: N${{ inputs.n_ris }} seed ${{ inputs.seed }} (${{ inputs.account_label }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KAGGLE_USERNAME: ${{ inputs.kaggle_username }}
      KAGGLE_KEY: ${{ secrets.kaggle_key }}
      N_RIS: ${{ inputs.n_ris }}
      SEED: ${{ inputs.seed }}
      ACCOUNT_LABEL: ${{ inputs.account_label }}
      REPO_COMMIT: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kaggle CLI
        run: python -m pip install "kaggle>=1.8.4,<3"

      - name: Build immutable V6 TD3 kernel
        shell: bash
        run: |
          set -euo pipefail
          rm -rf kaggle_submit
          mkdir -p kaggle_submit
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          n_ris = int(os.environ["N_RIS"])
          seed = int(os.environ["SEED"])
          commit = os.environ["REPO_COMMIT"]
          account = os.environ["ACCOUNT_LABEL"]
          slug = f"star-ris-td3-v6-full-n{n_ris}-seed-{seed}"
          tag = f"physical_v6_n{n_ris}_100k"
          archive_name = f"physical_v6_n{n_ris}_seed{seed}"
          runner = f'''from __future__ import annotations
          import json
          import shutil
          import subprocess
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          repo = Path("/kaggle/working/STAR_RIS_RSMA_TD3")
          output_root = Path("/kaggle/working/physical_v6_full")
          if repo.exists():
              shutil.rmtree(repo)
          subprocess.run(["git", "clone", "--filter=blob:none", "https://github.com/Juliolayme/STAR_RIS_RSMA_TD3.git", str(repo)], check=True)
          subprocess.run(["git", "checkout", "--detach", "{commit}"], cwd=repo, check=True)
          subprocess.run([sys.executable, "-m", "pip", "install", "-q", "--no-build-isolation", "-e", str(repo)], check=True)
          subprocess.run([
              sys.executable, "scripts/create_scenario_banks.py",
              "--config", "configs/v3/pilot_v6_soft_anchor_n{n_ris}.yaml",
              "--output-dir", "artifacts/scenario_banks",
              "--train-count", "10000", "--validation-count", "1000", "--test-count", "1000",
          ], cwd=repo, check=True)
          verification = Path("/kaggle/working/scenario_bank_verification_n{n_ris}.json")
          subprocess.run([
              sys.executable, "scripts/prepare_v6_scenario_banks.py",
              "--n-ris", "{n_ris}", "--verify-existing",
              "--manifest", str(verification),
          ], cwd=repo, check=True)
          subprocess.run([
              sys.executable, "scripts/pilot_structure_aware_td3.py",
              "--method", "td3",
              "--config", "configs/v3/pilot_v6_soft_anchor_n{n_ris}.yaml",
              "--seed", "{seed}", "--tag", "{tag}",
              "--output-root", str(output_root),
          ], cwd=repo, check=True)
          run_dir = output_root / "{tag}_seed{seed}"
          shutil.copy2(verification, run_dir / "SCENARIO_BANK_VERIFICATION.json")
          provenance = {{
              "experiment": "physical_v6_soft_anchor_full",
              "method": "td3",
              "n_ris": {n_ris},
              "seed": {seed},
              "train_steps": 100000,
              "repository": "Juliolayme/STAR_RIS_RSMA_TD3",
              "git_commit": "{commit}",
              "kaggle_account_label": "{account}",
              "finished_at_utc": datetime.now(timezone.utc).isoformat(),
          }}
          (run_dir / "KAGGLE_JOB_PROVENANCE.json").write_text(
              json.dumps(provenance, indent=2), encoding="utf-8"
          )
          shutil.make_archive(
              "/kaggle/working/{archive_name}", "zip", output_root, run_dir.name
          )
          '''
          Path("kaggle_submit/runner.py").write_text(runner, encoding="utf-8")
          metadata = {
              "id": f"{os.environ['KAGGLE_USERNAME']}/{slug}",
              "title": f"STAR-RIS TD3 V6 full N{n_ris} seed {seed}",
              "code_file": "runner.py",
              "language": "python",
              "kernel_type": "script",
              "is_private": True,
              "enable_gpu": True,
              "enable_internet": True,
              "enable_tpu": False,
              "dataset_sources": [],
              "kernel_sources": [],
              "competition_sources": [],
          }
          Path("kaggle_submit/kernel-metadata.json").write_text(
              json.dumps(metadata, indent=2), encoding="utf-8"
          )
          PY

      - name: Submit and monitor Kaggle kernel
        shell: bash
        run: |
          set -euo pipefail
          ref="${KAGGLE_USERNAME}/star-ris-td3-v6-full-n${N_RIS}-seed-${SEED}"
          kaggle kernels push -p kaggle_submit --accelerator NvidiaTeslaT4 --timeout 43200
          for attempt in $(seq 1 300); do
            status="$(kaggle kernels status "$ref" 2>&1 || true)"
            echo "attempt=${attempt} ${status}"
            normalized="$(echo "$status" | tr '[:upper:]' '[:lower:]')"
            if echo "$normalized" | grep -Eq 'complete|success'; then exit 0; fi
            if echo "$normalized" | grep -Eq 'error|failed|cancel'; then exit 1; fi
            sleep 30
          done
          echo "Timed out waiting for ${ref}" >&2
          exit 1

      - name: Download and verify training output
        shell: bash
        run: |
          set -euo pipefail
          ref="${KAGGLE_USERNAME}/star-ris-td3-v6-full-n${N_RIS}-seed-${SEED}"
          mkdir -p downloaded
          kaggle kernels output "$ref" -p downloaded
          python - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          n_ris = os.environ["N_RIS"]
          seed = os.environ["SEED"]
          archive = Path("downloaded") / f"physical_v6_n{n_ris}_seed{seed}.zip"
          if not archive.is_file() or archive.stat().st_size == 0:
              raise SystemExit(f"Missing output archive: {archive}")
          required = {
              "initial.pt", "best.pt", "latest.pt", "summary.json", "timing.json",
              "test_initial_raw.csv", "test_best_raw.csv", "test_latest_raw.csv",
              "manifest.json", "training.csv", "validation_summary.csv",
              "SCENARIO_BANK_VERIFICATION.json", "KAGGLE_JOB_PROVENANCE.json",
          }
          with zipfile.ZipFile(archive) as bundle:
              names = {Path(name).name for name in bundle.namelist() if not name.endswith("/")}
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f"Archive missing required files: {missing}")
          print(f"verified={archive} bytes={archive.stat().st_size}")
          PY

      - name: Upload immutable job evidence
        uses: actions/upload-artifact@v4
        with:
          name: physical-v6-n${{ inputs.n_ris }}-seed${{ inputs.seed }}
          path: downloaded/physical_v6_n${{ inputs.n_ris }}_seed${{ inputs.seed }}.zip
          if-no-files-found: error
          retention-days: 30

name: Collect V6 soft-anchor N128 pilot

on:
  workflow_dispatch:
  push:
    branches: [audit/ao-baseline-full-n128]
    paths: [experiments/structure_aware/COLLECT_V6_SOFT_ANCHOR_N128]

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "kaggle>=1.8.4,<3" pandas tabulate

      - name: Download completed V6 N128 kernels
        env:
          DDPG_KEY: ${{ secrets.KAGGLE_DDPG_KEY }}
          PPO_KEY: ${{ secrets.KAGGLE_PPO_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          download() {
            local user="$1" key="$2" seed="$3" destination="$4"
            local ref="${user}/star-ris-td3-v6-soft-anchor-n128-seed-${seed}"
            status="$(KAGGLE_USERNAME="$user" KAGGLE_KEY="$key" kaggle kernels status "$ref" 2>&1)"
            echo "$ref: $status"
            echo "$status" | grep -Eqi 'COMPLETE|SUCCESS' || exit 1
            mkdir -p "$destination"
            KAGGLE_USERNAME="$user" KAGGLE_KEY="$key" \
              kaggle kernels output "$ref" -p "$destination" --force \
              --file-pattern "v6_soft_anchor_n128_100k_seed${seed}\\.zip$" \
              --page-size 200
          }
          download ronganminh "$DDPG_KEY" 0 collected/v6_n128_seed0
          download duythanhb1909984 "$PPO_KEY" 1 collected/v6_n128_seed1
          find collected -name '*.zip' -type f -print0 | while IFS= read -r -d '' archive; do
            unzip -oq "$archive" -d "${archive%.zip}_extracted"
          done

      - name: Audit and aggregate
        run: |
          python scripts/audit_v6_soft_anchor.py \
            --input collected --output v6_n128_audit --n-ris 128
          cat v6_n128_audit/V6_REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: physical-v6-soft-anchor-n128
          path: |
            collected/
            v6_n128_audit/
          retention-days: 90

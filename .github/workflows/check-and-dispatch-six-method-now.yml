name: Check Kaggle six-method stages and dispatch collector

on:
  push:
    branches:
      - main
    paths:
      - experiments/six_method/COLLECT_NOW
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TD3_USER: thanhnguyen1423
      TD3_KEY: ${{ secrets.KAGGLE_TD3_KEY }}
      DDPG_USER: ronganminh
      DDPG_KEY: ${{ secrets.KAGGLE_DDPG_KEY }}
      PPO_USER: duythanhb1909984
      PPO_KEY: ${{ secrets.KAGGLE_PPO_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Kaggle CLI
        run: python -m pip install "kaggle>=1.8.4,<3"

      - name: Query six private kernels
        id: status
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/six_method_status"
          mkdir -p "$RUNNER_TEMP/six_method_status"

          query() {
            local user="$1"
            local key="$2"
            local ref="$3"
            local name="$4"
            KAGGLE_USERNAME="$user" KAGGLE_KEY="$key" \
              kaggle kernels status "$ref" > "$RUNNER_TEMP/six_method_status/${name}.txt" 2>&1 || true
            cat "$RUNNER_TEMP/six_method_status/${name}.txt"
          }

          query "$TD3_USER" "$TD3_KEY" "thanhnguyen1423/star-ris-td3-sixmethod-low-n-v1" "td3_low_n"
          query "$TD3_USER" "$TD3_KEY" "thanhnguyen1423/star-ris-td3-sixmethod-high-n-v1" "td3_high_n"
          query "$DDPG_USER" "$DDPG_KEY" "ronganminh/star-ris-ddpg-sixmethod-low-n-v1" "ddpg_low_n"
          query "$DDPG_USER" "$DDPG_KEY" "ronganminh/star-ris-ddpg-sixmethod-high-n-v1" "ddpg_high_n"
          query "$PPO_USER" "$PPO_KEY" "duythanhb1909984/star-ris-ppo-sixmethod-low-n-v1" "ppo_low_n"
          query "$PPO_USER" "$PPO_KEY" "duythanhb1909984/star-ris-ppo-sixmethod-high-n-v1" "ppo_high_n"

          python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "six_method_status"
          refs = {
              "td3_low_n": "thanhnguyen1423/star-ris-td3-sixmethod-low-n-v1",
              "td3_high_n": "thanhnguyen1423/star-ris-td3-sixmethod-high-n-v1",
              "ddpg_low_n": "ronganminh/star-ris-ddpg-sixmethod-low-n-v1",
              "ddpg_high_n": "ronganminh/star-ris-ddpg-sixmethod-high-n-v1",
              "ppo_low_n": "duythanhb1909984/star-ris-ppo-sixmethod-low-n-v1",
              "ppo_high_n": "duythanhb1909984/star-ris-ppo-sixmethod-high-n-v1",
          }
          stages = {}
          all_complete = True
          any_failed = False
          for name, ref in refs.items():
              raw = (root / f"{name}.txt").read_text(encoding="utf-8", errors="replace").strip()
              upper = raw.upper()
              complete = "COMPLETE" in upper
              failed = any(token in upper for token in ("ERROR", "FAILED", "CANCELLED", "CANCELED"))
              stages[name] = {
                  "kernel": ref,
                  "raw_status": raw,
                  "complete": complete,
                  "failed": failed,
              }
              all_complete &= complete
              any_failed |= failed
          payload = {
              "checked_utc": dt.datetime.now(dt.timezone.utc).isoformat(),
              "all_complete": all_complete,
              "any_failed": any_failed,
              "stages": stages,
          }
          output = root / "KAGGLE_STAGE_STATUS.json"
          output.write_text(json.dumps(payload, indent=2), encoding="utf-8")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"all_complete={str(all_complete).lower()}\n")
              handle.write(f"any_failed={str(any_failed).lower()}\n")
          print(json.dumps(payload, indent=2))
          PY

      - name: Persist status on experiment branch
        run: |
          set -euo pipefail
          git fetch origin experiments/drl-six-method-v1
          git checkout experiments/drl-six-method-v1
          mkdir -p experiments/six_method
          cp "$RUNNER_TEMP/six_method_status/KAGGLE_STAGE_STATUS.json" \
             experiments/six_method/KAGGLE_STAGE_STATUS.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/six_method/KAGGLE_STAGE_STATUS.json
          git commit -m "Record current six-method Kaggle stage status" || true
          git push origin HEAD:experiments/drl-six-method-v1

      - name: Fail when a Kaggle stage failed
        if: steps.status.outputs.any_failed == 'true'
        run: |
          cat "$RUNNER_TEMP/six_method_status/KAGGLE_STAGE_STATUS.json"
          exit 1

      - name: Dispatch full collector
        if: steps.status.outputs.all_complete == 'true'
        run: gh workflow run collect-six-method-results.yml --ref main

      - name: Report incomplete stages
        if: steps.status.outputs.all_complete != 'true' && steps.status.outputs.any_failed != 'true'
        run: |
          echo "At least one Kaggle stage is not complete yet."
          cat "$RUNNER_TEMP/six_method_status/KAGGLE_STAGE_STATUS.json"
